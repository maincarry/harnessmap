# Build the HarnessMap desktop companion.
#
# Iteration mode (workflow_dispatch): builds macOS UNSIGNED and uploads the .dmg/.app
# as a downloadable workflow artifact — for testing the native app without a local
# toolchain. Signing, Windows/Linux, and the release/updater come back once this is green.
name: companion-release

on:
  workflow_dispatch: {}
  push:
    tags: ["companion-v*"]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "companion/src-tauri -> target"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Generate app icons
        run: cd companion && cargo tauri icon app-icon-source.png

      - name: Build (macOS, unsigned)
        run: cd companion && cargo tauri build

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: companion-macos
          path: |
            companion/src-tauri/target/release/bundle/dmg/*.dmg
            companion/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
