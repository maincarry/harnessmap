<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harnessmap</title>
<style>
  :root {
    --bg: #f5f6f2; --panel: #fdfdfb; --ink: #202b36; --muted: #5c6c7a;
    --hair: #dce1d9; --accent: #2560b8; --warn: #b57e22; --user: #eef2fa;
    --danger: #c43c3c;
    --new0: #2560b826; --new1: #2560b817; --new2: #2560b80c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f161f; --panel: #151e29; --ink: #e3e9ef; --muted: #8fa0b0;
            --hair: #243140; --accent: #7cacf2; --warn: #d9a24c; --user: #1a2532;
            --danger: #e06c6c;
            --new0: #7cacf22e; --new1: #7cacf21c; --new2: #7cacf20e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; background: var(--bg); color: var(--ink);
         display: grid; grid-template-columns: var(--split, 40%) 6px 1fr; height: 100vh; }
  #splitter { cursor: col-resize; background: var(--hair); position: relative; }
  /* M133 (Jacob): mobile — one pane at a time, bottom switcher. body.mobile
     is set by JS from viewport width so tests can drive it deterministically. */
  body.mobile { grid-template-columns: 1fr; grid-template-rows: 1fr 52px; }
  body.mobile #map-pane, body.mobile #chat-pane { grid-row: 1; grid-column: 1; min-height: 0; }
  body.mobile #mob-bar { grid-row: 2; grid-column: 1; }
  body.mobile #tip { display: none; }
  body.mobile #splitter { display: none; }
  /* M135 (Jacob): ChatGPT-mobile philosophy — radical subtraction. One slim
     top bar (☰ + map name), content full-bleed, one composer at the bottom;
     everything else lives in the drawer or the per-row sheets. */
  body.mobile #map-pane > header, body.mobile #zoom-tools { display: none; }
  body.mobile .tguide { width: 10px; margin-left: 0; border: none; }
  body.mobile .caret, body.mobile .rowmore, body.mobile .badge, body.mobile .glyph,
  body.mobile .ntype, body.mobile .prov, body.mobile #round-line, body.mobile #add-root { display: none; }
  body.mobile .nrow { min-height: 46px; align-items: center; padding: 4px 16px 4px 8px; }
  body.mobile .nrow .ncontent { font-size: 16px; line-height: 1.35; }
  body.mobile .nrow.heading .ncontent { font-weight: 600; }
  body.mobile .nrow.focused { border: none; border-left: 3px solid var(--accent); border-radius: 0; background: none; }
  body.mobile .nrow.focused .ncontent { color: var(--accent); }
  body.mobile .fold-count { border: none; background: none; padding: 0; font-size: 13px; color: var(--muted); }
  body.mobile .chip-new { border: none; padding: 0; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); overflow: hidden; color: transparent; }
  body.mobile .chip-new.changed { background: var(--muted); }
  body.mobile .sdot { font-size: 15px; padding: 0 4px; }
  body.mobile .nrow.tosort { border: none; background: none; opacity: .75; }
  body.mobile #mob-top { display: flex; }
  .msg pre.code, .msg pre { background: rgba(0,0,0,.25); border-radius: 6px; padding: 8px 10px; margin: 6px 0; overflow-x: auto; font-size: 12px; line-height: 1.5; white-space: pre; }
  .msg pre code { background: none; padding: 0; font-size: 12px; }
  .msg p { margin: 6px 0; }
  .msg p:first-child { margin-top: 0; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }
  .msg li { margin: 2px 0; }
  .msg h1, .msg h2, .msg h3, .msg h4 { font-size: 14px; margin: 10px 0 4px; }
  .msg blockquote { border-left: 3px solid var(--hair); margin: 6px 0; padding: 2px 10px; color: var(--muted); }
  .msg a { color: var(--accent); }
  .msg table { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
  .msg th, .msg td { border: 1px solid var(--hair); padding: 3px 8px; }
  .msg code { background: rgba(0,0,0,.2); border-radius: 4px; padding: 1px 5px; font-size: 12px; }
  .msg .li { display: block; padding-left: 6px; }
  .msg.assistant { position: relative; }
  .mcopy { position: absolute; top: 4px; right: 4px; border: 1px solid var(--hair); background: var(--panel); color: var(--muted);
           border-radius: 5px; cursor: pointer; font-size: 11px; padding: 2px 7px; opacity: 0; transition: opacity .12s; }
  .msg.assistant:hover .mcopy { opacity: 1; }
  body.mobile .mcopy { display: none; }
  #mob-top { display: none; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--hair); }
  #mob-top #mob-menu { border: none; background: none; color: var(--ink); font-size: 22px; padding: 4px 10px; cursor: pointer; }
  #mob-top #mob-title { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
  #mob-top #mob-health { font-size: 11px; color: var(--muted); }
  body.mobile #crumbs { padding: 6px 12px; font-size: 13px; }
  #mob-bar { display: none; grid-row: 2; grid-column: 1; border-top: 1px solid var(--hair); background: var(--panel);
             align-items: center; gap: 8px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); }
  body.mobile #mob-bar { display: flex; }
  #mob-flip { border: none; background: none; font-size: 22px; padding: 6px 8px; cursor: pointer; }
  #mob-ask { flex: 1; min-height: 44px; border: 1px solid var(--hair); border-radius: 22px; padding: 10px 18px;
             background: var(--bg); color: var(--ink); font: inherit; font-size: 15px; }
  body.mobile.mob-chat #mob-ask { display: none; }
  body.mobile.mob-chat #mob-bar { padding: 4px 10px calc(4px + env(safe-area-inset-bottom)); }
  #mob-drawer-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 450; }
  #mob-drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(84vw, 340px); background: var(--panel);
                overflow-y: auto; padding: 8px 0 30px; box-shadow: 6px 0 30px rgba(0,0,0,.35); border-radius: 0 16px 16px 0; }
  #mob-drawer .dr-h { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 14px 18px 4px; }
  #mob-drawer .dr-row { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: none;
                        color: var(--ink); font: inherit; font-size: 15px; padding: 12px 18px; cursor: pointer; }
  #mob-drawer .dr-row:active { background: var(--hair); }
  #mob-drawer .dr-row .g { min-width: 26px; color: var(--accent); }
  #mob-drawer .dr-row.on { color: var(--accent); font-weight: 600; }
  body.mobile.mob-chat #map-pane { display: none; }
  body.mobile:not(.mob-chat) #chat-pane { display: none; }
  body.mobile .nrow { min-height: 40px; align-items: center; }
  body.mobile .caret { min-width: 40px; min-height: 36px; font-size: 21px; }
  body.mobile .rowops { display: none; }
  .rowmore { display: none; margin-left: auto; border: 1px solid var(--hair); background: var(--panel); color: var(--muted);
             border-radius: 4px; cursor: pointer; font-size: 14px; padding: 2px 10px; flex: none; }
  body.mobile .modal { width: 100vw !important; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; overflow-y: auto; }
  #phone-ov { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 500; display: flex; align-items: center; justify-content: center; }
  #phone-frame { background: #000; border-radius: 44px; padding: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.6); position: relative; }
  #phone-frame iframe { width: 402px; height: 874px; border: none; border-radius: 32px; background: var(--bg); display: block; }
  #phone-close { position: absolute; top: -14px; right: -14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--hair);
                 background: var(--panel); color: var(--ink); cursor: pointer; font-size: 15px; }
  #phone-note { position: absolute; bottom: -28px; left: 0; right: 0; text-align: center; color: #ccc; font-size: 12px; }
  #sheet-ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 400; display: flex; align-items: flex-end; }
  #sheet { width: 100%; background: var(--panel); border-radius: 16px 16px 0 0; padding: 8px 0 calc(14px + env(safe-area-inset-bottom)); max-height: 70dvh; overflow-y: auto; }
  #sheet h4 { margin: 0; font-size: 16px; font-weight: 600; padding: 12px 18px 8px; }
  #sheet .sh-row { display: flex; gap: 12px; align-items: baseline; width: 100%; text-align: left; background: none; border: none; color: var(--ink);
                   font: inherit; font-size: 15px; padding: 12px 18px; cursor: pointer; }
  #sheet .sh-row:active { background: var(--hair); }
  #sheet .sh-row .g { min-width: 26px; color: var(--accent); }
  #sheet .sh-row .d { color: var(--muted); font-size: 12px; }
  #splitter:hover, #splitter.dragging { background: var(--accent); }
  body.splitting { user-select: none; cursor: col-resize; }
  #map-pane, #chat-pane { display: flex; flex-direction: column; overflow: hidden; }
  #map-pane { border-right: 1px solid var(--hair); position: relative; }
  header { padding: 8px 12px; border-bottom: 1px solid var(--hair); display: flex; gap: 8px; align-items: center;
           font-weight: 600; background: var(--panel); }
  header .lag { font-weight: 400; font-size: 12px; color: var(--muted); }
  #beat .step { opacity: .3; }
  #beat .step.on { opacity: 1; color: var(--accent); }
  #beat .step.done { opacity: 1; color: var(--ink); }
  #beat.stale { color: var(--danger); }
  @keyframes beatpulse { 50% { opacity: .35; } }
  #beat .step.on { animation: beatpulse 1.2s infinite; }
  header .lag.behind { color: var(--warn); }
  .hbtn { border: 1px solid var(--hair); background: var(--bg); color: var(--muted); border-radius: 6px;
          font-size: 12px; cursor: pointer; padding: 2px 8px; }

  #crumbs { display: flex; gap: 4px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--hair);
            font-size: 12px; color: var(--muted); flex-wrap: wrap; background: var(--panel); }
  #crumbs .crumb { cursor: pointer; color: var(--accent); }
  #crumbs .sep { opacity: .5; }
  #crumbs .focus-away { margin-left: auto; color: var(--warn); cursor: pointer; }
  #zoom-tools { display: flex; gap: 6px; padding: 5px 12px; border-bottom: 1px solid var(--hair); background: var(--panel); flex-wrap: wrap; }
  #zoom-tools button { border: 1px solid var(--hair); background: var(--bg); color: var(--muted); border-radius: 6px;
                       font-size: 11px; cursor: pointer; padding: 1px 8px; }

  #tree { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .nrow { display: flex; align-items: stretch; gap: 5px; padding: 1px 4px; border-radius: 5px; }
  .nrow > *, .folded-line > * { align-self: baseline; }
  .tguide { width: 13px; flex: none; align-self: stretch; border-left: 1px solid var(--muted); opacity: .3; margin-left: 5px; }
  .folded-line { display: flex; }
  .nrow:hover { background: var(--user); }
  /* the focus: one bright frame — nothing else changes */
  .nrow.focused { border: 2px solid var(--accent); border-radius: 6px; padding-top: 0; padding-bottom: 0; }
  /* M112: "to sort" is a TRAY, not a topic — separated, dashed, always last */
  .nrow.tosort { margin-top: 14px; border: 1px dashed var(--hair); border-radius: 8px;
                 background: color-mix(in srgb, var(--panel) 60%, var(--bg)); padding-top: 3px; padding-bottom: 3px; }
  .nrow.tosort > .ncontent::before { content: '📥 '; }
  .nrow.tosort > .ncontent { color: var(--muted); font-weight: 600; }
  #round-line { cursor: pointer; }
  #round-line:hover { color: var(--accent); }
  #changes-panel { position: absolute; bottom: 34px; left: 12px; right: 12px; max-height: 45vh; overflow-y: auto;
                   background: var(--panel); border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px;
                   box-shadow: 0 6px 24px rgba(0,0,0,.15); z-index: 60; font-size: 13px; }
  #changes-panel h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  #dev-panel { position: absolute; top: 44px; bottom: 34px; left: 12px; right: 12px; overflow-y: auto; z-index: 45;
    background: var(--panel, #16181d); border: 1px solid var(--line, #2a2e37); border-radius: 8px; padding: 10px 12px; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #dev-panel h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .dev-row { border: 1px solid var(--line, #2a2e37); border-radius: 6px; margin-bottom: 6px; }
  .dev-row > summary { list-style: none; cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; font-size: 12px; }
  .dev-row > summary::-webkit-details-marker { display: none; }
  .dev-row .dv-task { font-weight: 600; }
  .dev-row .dv-meta { color: var(--muted); font-size: 11px; }
  .dev-row .dv-fail { color: #e66; }
  .dev-row pre { margin: 0 8px 8px; padding: 8px; font-size: 11px; line-height: 1.45; max-height: 260px; overflow: auto;
    background: rgba(0,0,0,.25); border-radius: 5px; white-space: pre-wrap; word-break: break-word; }
  .dev-row .dv-sec { margin: 2px 8px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .chg-row { display: flex; gap: 8px; padding: 3px 6px; border-radius: 6px; cursor: pointer; align-items: baseline; }
  .chg-row:hover { background: var(--user); }
  .chg-k { flex: none; font-size: 11px; width: 58px; color: var(--muted); }
  .chg-k.added { color: var(--accent); }
  .chg-k.removed { color: var(--danger); }
  .chg-k.flagged { color: var(--warn); }
  @keyframes rowflash { 0%, 60% { background: var(--user); } }
  .nrow.flash { animation: rowflash 1.6s ease-out; }
  .caret { cursor: pointer; color: var(--muted); min-width: 34px; min-height: 28px; padding: 2px 8px;
           font-size: 19px; line-height: 24px; user-select: none; flex: none; text-align: center; border-radius: 6px; }
  .caret:hover { background: var(--hair); color: var(--ink); }
  .badge { font-size: 12px; user-select: none; flex: none; }
  .badge.focus { color: var(--accent); }
  .badge.lit { color: var(--warn); }
  .sdot { color: var(--danger); cursor: pointer; font-size: 11px; animation: sdot-in .3s; flex: none; }

  @keyframes sdot-in { from { transform: scale(2); opacity: 0; } }
  .glyph { width: 1em; text-align: center; flex: none; }
  .ntype { color: var(--muted); font-size: 11px; cursor: pointer; flex: none; }
  .ntype:hover { text-decoration: underline dotted; }
  .ncontent { cursor: pointer; }
  .heading > .ncontent { font-weight: 600; }
  .dead { opacity: .45; }
  .dead > .ncontent { text-decoration: line-through; }
  .exploratory { opacity: .62; }
  .exploratory > .ncontent { font-style: italic; }
  .prov { color: var(--warn); }
  .rec-0 { background: var(--new0); border-radius: 4px; }
  /* same chip vocabulary as the category chips (.ntype): hairline, quiet.
     Persist until clicked/cleared, so they stay SMALL. */
  .chip-new { flex: none; align-self: center; font-size: 9px; padding: 0 4px; border-radius: 3px;
              border: 1px solid var(--accent); background: var(--panel); color: var(--accent); }
  .chip-new.changed { border-color: var(--hair); color: var(--muted); }
  .rowops { visibility: hidden; display: flex; gap: 4px; margin-left: 6px; flex: none; }
  .nrow:hover .rowops { visibility: visible; }
  .rowbtn { border: 1px solid var(--hair); background: var(--panel); color: var(--ink);
            border-radius: 4px; cursor: pointer; font-size: 11px; padding: 0 6px; white-space: nowrap; }
  .rowbtn:hover { border-color: var(--accent); color: var(--accent); }
  .rowbtn.danger:hover { border-color: var(--danger); color: var(--danger); }
  /* the focused node's ▶ lights up and stays visible without hover
     (visibility:visible on a child overrides the cluster's hidden) */
  .rowbtn.on { visibility: visible; color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .rowbtn[data-fav].on { color: var(--warn); border-color: var(--warn); }
  .folded-line { color: var(--muted); font-size: 12px; font-style: italic; }
  .fold-count { font-size: 11px; color: var(--muted); cursor: pointer; border: 1px solid var(--hair); border-radius: 3px; padding: 0 5px; white-space: nowrap; }
  .fold-count:hover { color: var(--ink); background: var(--hair); }
  .home-ico { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; vertical-align: -1px; }
  #add-root { margin: 8px 0 0 2px; border: 1px dashed var(--hair); background: none; color: var(--muted);
              border-radius: 6px; cursor: pointer; font-size: 12px; padding: 2px 10px; display: block; }

  #round-line { padding: 6px 12px; border-top: 1px solid var(--hair); font-size: 12px; color: var(--muted);
                font-style: italic; min-height: 2.2em; background: var(--panel); }
  #messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); border: 1px solid var(--hair); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--hair); }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; font-style: italic;
                background: none; border: none; padding: 0; }
  .msg.pending { opacity: .55; font-style: italic; }
  #composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--hair); background: var(--panel); }
  #composer textarea { flex: 1; resize: none; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px;
                       background: var(--bg); color: var(--ink); font: inherit; height: 3.2em; }
  #composer button { border: none; background: var(--accent); color: #fff; border-radius: 8px; padding: 0 18px;
                     font-weight: 600; cursor: pointer; }
  .empty { color: var(--muted); padding: 20px; text-align: center; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center;
             justify-content: center; z-index: 40; }
  .modal { background: var(--panel); color: var(--ink); border: 1px solid var(--hair); border-radius: 12px;
           max-width: 760px; width: 92%; max-height: 84vh; overflow-y: auto; padding: 18px 20px; }
  .modal h3 { margin: 0 0 6px; font-size: 15px; }
  .modal pre { background: var(--bg); border: 1px solid var(--hair); border-radius: 8px; padding: 10px;
               font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .modal .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal label { display: block; font-size: 13px; margin: 3px 0; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
  .modal .actions button { border: 1px solid var(--hair); border-radius: 8px; padding: 6px 16px; cursor: pointer;
                           background: var(--panel); color: var(--ink); }
  .modal .actions .primary { background: var(--accent); color: #fff; border: none; }
  /* talk to map (M77-M79) — same visual language as the main chat pane */
  #mc-log { flex: 1; min-height: 200px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 8px; padding: 8px 2px; font-size: 13px; }
  #mc-log .msg { font-size: 13px; }
  .mc-card { align-self: stretch; border: 1px dashed var(--accent); border-radius: 10px; padding: 9px 12px;
             font-size: 13px; display: flex; flex-direction: column; gap: 7px; background: var(--new2); }
  .mc-card.applied { border: 1px solid var(--hair); background: none; color: var(--muted); }
  .mc-card button { align-self: flex-start; border: none; border-radius: 8px; padding: 6px 16px;
                    cursor: pointer; background: var(--accent); color: #fff; font: inherit; font-size: 13px; }
  .mc-card button:disabled { opacity: .6; cursor: default; }
  #mc-composer { display: flex; gap: 8px; border-top: 1px solid var(--hair); padding-top: 10px; margin-top: 6px; }
  #mc-composer input { flex: 1; min-width: 0; border: 1px solid var(--hair); border-radius: 8px; padding: 8px 10px;
                       background: var(--bg); color: var(--ink); font: inherit; }
  #mc-composer .primary { background: var(--accent); color: #fff; border: none; border-radius: 8px;
                          padding: 6px 16px; cursor: pointer; font: inherit; }
  .mc-hint { font-weight: 400; font-size: 11px; color: var(--muted); }
  #tabbar { display: flex; gap: 4px; padding: 6px 12px 0; background: var(--panel); border-bottom: 1px solid var(--hair); flex-wrap: wrap; }
  #tabbar .tab { border: 1px solid var(--hair); border-bottom: none; background: var(--bg); color: var(--muted);
                 border-radius: 8px 8px 0 0; font-size: 12px; cursor: pointer; padding: 4px 12px; }
  #tabbar .tab.on { background: var(--panel); color: var(--ink); font-weight: 600; }
  #tabbar .tab .tx { margin-left: 8px; opacity: .5; }
  #tabbar .tab .tx:hover { opacity: 1; color: var(--danger); }
  #tabbar #tab-add { border: 1px dashed var(--hair); background: none; color: var(--muted); border-radius: 8px 8px 0 0;
                     font-size: 12px; cursor: pointer; padding: 4px 10px; }
  .termhost { flex: 1; min-height: 0; padding: 6px; background: #000; display: none; position: relative; }
  .term-fit { position: absolute; top: 6px; right: 10px; z-index: 5; border: 1px solid #333; background: #111;
              color: #888; border-radius: 6px; font-size: 12px; cursor: pointer; padding: 1px 7px; opacity: .55; }
  .term-fit:hover { opacity: 1; color: #fff; }
  .termhost.on { display: block; }
  #proj-sel, #chat-sel { max-width: 140px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
  #other-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; display: flex;
                flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--hair);
                border-radius: 10px; padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.15); min-width: 170px; }
  #other-menu button { text-align: left; }
  #other-more { display: flex; flex-direction: column; gap: inherit; border-top: 1px solid var(--hair); margin-top: 2px; padding-top: 4px; }
  #other-more[hidden] { display: none; }
  #other-more-btn { color: var(--muted); }
  #other-menu[hidden] { display: none; }
  /* M96c: instant styled tooltips replacing the slow native title bubble */
  #tip { position: fixed; z-index: 200; max-width: 280px; background: var(--panel); color: var(--ink);
         border: 1px solid var(--hair); border-radius: 10px; padding: 6px 10px; font-size: 12px;

         opacity: 0; transition: opacity .12s; }
  #tip.show { opacity: 1; }

  /* M84: node search */
  #sr-input { width: 100%; border: 1px solid var(--hair); border-radius: 8px; padding: 9px 12px;
              background: var(--bg); color: var(--ink); font: inherit; font-size: 14px; }
  #sr-list { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; max-height: 46vh; overflow-y: auto; }
  .sr-row { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .sr-row:hover { background: var(--user); }
  .sr-row .sr-star { cursor: pointer; opacity: .35; }
  .sr-row .sr-star.on { opacity: 1; color: var(--warn); }
  .sr-row .sr-path { color: var(--muted); font-size: 11px; margin-left: auto; text-align: right; }
  .sr-section { font-size: 11px; color: var(--muted); margin: 8px 0 2px; }
  .sr-hist { color: var(--accent); cursor: pointer; font-size: 13px; padding: 3px 8px; border-radius: 6px; }
  .sr-hist:hover { background: var(--user); }
  .sr-crumbs { font-size: 12px; color: var(--muted); }
  .sr-crumbs b { color: var(--ink); }
  .sr-node { border: 1px solid var(--hair); border-radius: 10px; padding: 10px 12px; margin: 8px 0; font-size: 13px; background: var(--bg); }
  .sr-kids { font-size: 12px; color: var(--muted); }

  /* M108: guided tour — a spotlight over the real UI */
  /* one highlight only: the dark cutout + the dashed circle (no second frame) */
  #tour-hole { position: fixed; z-index: 300; border-radius: 8px; pointer-events: none;
               box-shadow: 0 0 0 9999px rgba(10, 14, 20, .82);
               transition: all .25s ease; }
  /* the CIRCLE: an animated dashed ring drawn around the element — no ambiguity */
  #tour-ring { position: fixed; z-index: 302; pointer-events: none; border: 2px dashed #fff;
               border-radius: 14px; animation: tourpulse 1.6s ease-in-out infinite; }
  @keyframes tourpulse { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.05); opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { #tour-ring { animation: none; } }
  #tour-card { position: fixed; z-index: 301; width: min(360px, 92vw); background: var(--panel);
               border: 1px solid var(--hair); border-radius: 12px; padding: 14px 16px;
               box-shadow: 0 10px 40px rgba(0,0,0,.3); font-size: 13px; line-height: 1.55; }
  #tour-card h4 { margin: 0 0 6px; font-size: 14px; }
  #tour-card .tour-step { color: var(--muted); font-size: 11px; }
  #tour-card .actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  #tour-card .actions button { border: 1px solid var(--hair); border-radius: 8px; padding: 5px 12px;
                               cursor: pointer; background: var(--panel); color: var(--ink); font-size: 12px; }
  #tour-card .actions .primary { background: var(--accent); color: #fff; border: none; }
  .tour-target .rowops { visibility: visible !important; opacity: 1 !important; }
  .legend-table { font-size: 13px; width: 100%; border-collapse: collapse; }
  .legend-table td { padding: 3px 8px 3px 0; vertical-align: top; }
  .legend-table td:first-child { white-space: nowrap; color: var(--muted); }
  .lit-row { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; font-size: 13px; }
  .lit-row .lit-toggle { cursor: pointer; opacity: .4; }
  .lit-row .lit-toggle.on { opacity: 1; color: var(--warn); }
  .lit-row .focus-t.on { color: var(--accent); }
.nudge-dot { color:#e0443a; margin-left:4px; font-size:9px; vertical-align:2px; animation: nudgepulse 1.6s ease-in-out infinite; }
@keyframes nudgepulse { 50% { opacity:.35; } }
</style>

<body>
  <div id="map-pane">

<script>
const GLYPH = { accepted:'✓', decided:'✓', done:'✓', answered:'✓', chosen:'✓', cited:'✓',
  open:'○', live:'○', proposed:'○', todo:'▢', doing:'▣', floated:'⚠', noted:'⚠', provisional:'⚠',
  rejected:'✗', dropped:'✗', retracted:'✗', reversed:'✗', mooted:'✗', lifted:'✗',
  parked:'‖', hard:'‼', active:'○', relaxed:'○', exploratory:'∿' };
const DEAD = ['rejected','dropped','retracted','reversed','mooted'];

let S = { nodes: [], chats: [], recency: {}, suggestions: [], mainChatId: null };
let zoomId = localStorage.getItem('hm-zoom') || null;
let folded = new Set(), userFolded = new Set(), userUnfolded = new Set();

const $ = (id) => document.getElementById(id);
const HOME_ICO = '<svg class="home-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.2 8 3.2l5.5 5"/><path d="M4.2 7.4V12.8h7.6V7.4"/></svg>';
const chat = () => S.chats.find(c => c.id === S.mainChatId);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function post(p, b) {
  const r = await fetch(p, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(b) });
  let d = null; try { d = await r.json(); } catch {}
  if (!r.ok && !(r.status === 202)) throw new Error(d?.error ?? `HTTP ${r.status}`);
  return d ?? {};
}
const node = (id) => S.nodes.find(n => n.id === id);
const disp = (n) => n ? (n.title || n.content) : '';
const sugFor = (id) => (S.suggestions ?? []).find(s => s.nodeId === id);
const kidsOf = (id) => S.nodes.filter(n => n.parentId === id);

function pathOf(id) {
  const path = [];
  let n = node(id);
  while (n) { path.unshift(n); n = node(n.parentId); }
  return path;
}
function subtreeIds(id) {
  const out = [id];
  for (const k of kidsOf(id)) out.push(...subtreeIds(k.id));
  return out;
}
function setZoom(id) {
  zoomId = id;
  if (id) localStorage.setItem('hm-zoom', id); else localStorage.removeItem('hm-zoom');
  renderAll();
}

// ---- breadcrumbs + focus-elsewhere indicator (Z2) ----
function renderCrumbs() {
  const el = $('crumbs');
  const parts = [`<span class="crumb" data-crumb="">whole map</span>`];
  if (zoomId && node(zoomId)) {
    // M123b (Jacob): the genealogy trail broke with long names (untitled
    // nodes carry whole sentences) — clip each segment, full name on hover.
    for (const n of pathOf(zoomId)) {
      const t = disp(n);
      parts.push(`<span class="sep">›</span><span class="crumb" data-crumb="${n.id}" title="${esc(t)}">${esc(t.length > 26 ? t.slice(0, 25) + '…' : t)}</span>`);
    }
  }
  // The focus chip is ALWAYS visible (it used to appear only when zoomed —
  // effectively lost). Amber when the focus is outside the current view.
  const f = chat()?.focusContainerId;
  let focusChip = '';
  if (f && node(f)) {
    const away = zoomId ? !pathOf(f).some(n => n.id === zoomId) && f !== zoomId : false;
    focusChip = `<span class="focus-away" style="${away ? '' : 'color:var(--muted)'}" data-jump-focus="${f}" title="${away ? 'the focus is outside this view — click to zoom to it' : 'click to jump to the focus (offers auto-zoom)'}">▶ focus: ${esc(disp(node(f)))}</span>`;
  }
  el.innerHTML = parts.join('') + focusChip;
}
$('crumbs').addEventListener('click', (e) => {
  const j = e.target.closest('[data-jump-focus]');
  if (j) {
    const fid = j.dataset.jumpFocus;
    const row = document.querySelector('.nrow.focused');
    if (row) { // visible: scroll to it and flash; offer zoom as the choice
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1600);
      if (confirm('Zoom the view in to the focus?')) {
        setZoom(fid);
        post(`/api/chats/${S.mainChatId}/zoomin`, { nodeId: fid, focus: false }).catch(() => {});
      }
    } else if (confirm('The focus is outside this view. Zoom the view to it?')) {
      setZoom(fid);
      post(`/api/chats/${S.mainChatId}/zoomin`, { nodeId: fid, focus: false }).catch(() => {});
    }
    return;
  }
  const c = e.target.closest('[data-crumb]');
  if (c) setZoom(c.dataset.crumb || null);
});

// ---- auto-fold within the current view ----
// M120 (Jacob): expanding a node shows ONLY its immediate children — every
// deeper parent starts collapsed until expanded itself. Exempt: the focus
// path (the conversation's thread stays visible) and the zoom root (its
// children ARE the zoomed view).
function applyAutoFold() {
  const f = chat()?.focusContainerId;
  const focusPath = new Set(f ? pathOf(f).map(n => n.id) : []);
  folded = new Set();
  for (const n of S.nodes) {
    if (n.status === 'removed' || n.id === zoomId) continue;
    if (kidsOf(n.id).length > 0 && !focusPath.has(n.id) && !userUnfolded.has(n.id)) folded.add(n.id);
  }
  for (const id of userFolded) folded.add(id);
}

function renderTree() {
  const tree = $('tree');
  const lit = new Set(chat()?.lit ?? []);
  const focus = chat()?.focusContainerId;
  const rec = S.recency || {};
  const recCls = (id) => rec[id] ? ' rec-0' : '';
  const recChip = (id) => rec[id] === 'new'
    ? '<span class="chip-new" data-tip="added by the map since you last touched this — click the node to clear">new</span>'
    : rec[id] === 'changed'
      ? '<span class="chip-new changed" data-tip="edited by the map since you last touched this — click the node to clear">changed</span>'
      : '';

  const row = (n, depth) => {
    const kids = kidsOf(n.id);
    const isTray = n.parentId === null && (n.title || n.content).startsWith('to sort');
    const heading = !n.type;
    const cls = [
      'nrow',
      heading ? 'heading' : '',
      (n.parentId === null && (n.title || n.content).startsWith('to sort')) ? 'tosort' : '',
      n.id === focus ? 'focused' : '',
      DEAD.includes(n.status) ? 'dead' : '',
      n.status === 'exploratory' ? 'exploratory' : '',
    ].filter(Boolean).join(' ');
    return `
    <div class="${cls}${recCls(n.id)}" title="${esc(n.title && n.title !== n.content ? n.content + ' — ' : '')}status: ${esc(n.status)}">
      ${'<span class="tguide"></span>'.repeat(depth)}
      <span class="caret" data-fold="${n.id}" title="${kids.length ? (folded.has(n.id) ? 'expand: show its immediate children' : 'collapse this branch') : 'nothing nested under this node yet — + adds a sub-node'}">${kids.length ? (folded.has(n.id) ? '▸' : '▾') : '·'}</span>
      ${lit.has(n.id) ? '<span class="badge lit" title="in the chat agent’s background">☀</span>' : ''}
      ${S.home === n.id ? `<span class="badge" title="home page — the home button (top of the map) zooms here">${HOME_ICO}</span>` : ''}
      ${n.type ? `<span class="glyph">${GLYPH[n.status] ?? '·'}</span><span class="ntype" data-retype="${n.id}" title="click to change category">${esc(n.type)}</span>` : ''}
      <span class="ncontent" data-edit="${n.id}" title="${esc(n.title && n.title !== n.content ? n.content : 'click to edit')}">${esc(disp(n))}${n.status === 'provisional' ? ' <span class="prov">⚠</span>' : ''}</span>
      ${kids.length && folded.has(n.id) ? `<span class="fold-count" data-fold="${n.id}" title="expand: show the ${kids.length} child node(s)">${subtreeIds(n.id).length - 1} inside</span>` : ''}
      ${recChip(n.id)}
      ${sugFor(n.id) ? `<span class="sdot ${sugFor(n.id).kind === 'relight' ? 'relight' : ''}" data-sug="${n.id}" title="${sugFor(n.id).kind === 'relight' ? 'placement suggestion: the map knows where this belongs — click to approve the move' : 'the map suggests a restructure here — click to see'}">●</span>` : ''}
      <button class="rowmore" data-sheet="${n.id}" title="all actions for this node">⋯</button>
      <span class="rowops">
        ${n.id === zoomId ? '' : `<button class="rowbtn" data-zoomin="${n.id}" title="zoom in: isolate this subtree in the view (lighting unchanged); offers a focus shift">◱</button>`}
        <button class="rowbtn ${n.id === focus ? 'on' : ''}" data-focus="${n.id}" title="${n.id === focus ? 'the conversation is focused here' : 'focus: aim the conversation here (no zoom)'}">▶</button>
        <button class="rowbtn ${lit.has(n.id) ? 'on' : ''}" data-lit="${n.id}" data-on="${lit.has(n.id) ? '1' : ''}" title="${lit.has(n.id) ? 'dim: remove from the chat agent’s background' : 'light as background (incl. everything under it)'}">☀</button>
        <button class="rowbtn ${(S.favorites || []).includes(n.id) ? 'on' : ''}" data-fav="${n.id}" title="${(S.favorites || []).includes(n.id) ? 'unpin from favorites' : 'favorite: pin this node to the top of search'}">★</button>
        <button class="rowbtn ${S.home === n.id ? 'on' : ''}" data-sethome="${n.id}" title="${S.home === n.id ? 'this is the home page — click to unset (home falls back to the whole map)' : 'set as the home page — the home button (top of the map) zooms here'}">${HOME_ICO}</button>
        <button class="rowbtn" data-add="${n.id}" title="add an unnamed sub-node here and focus it — the map names it from what you talk about next">+</button>
        ${(() => { const p = node(n.parentId); return p && p.parentId === null && (p.title || p.content).startsWith('to sort')
          ? `<button class="rowbtn" data-promote="${n.id}" title="make this a real top-level topic">⇧</button>` : ''; })()}
        ${isTray ? '' : `<button class="rowbtn" data-move="${n.id}" data-name="${esc(disp(n))}" title="move this node somewhere else on the map — search for the new parent, or make it a top-level topic">↖</button>`}
        ${kids.length && !isTray ? `<button class="rowbtn" data-reorg="${n.id}" data-name="${esc(disp(n))}" title="propose a cleanup of this subtree">⟳</button>` : ''}
        ${isTray ? '' : `<button class="rowbtn" data-merge="${n.id}" data-name="${esc(disp(n))}" title="merge this node into another — children move to the survivor, this one disappears">⇢</button>
        <button class="rowbtn danger" data-ndel="${n.id}" data-name="${esc(disp(n))}" data-count="${subtreeIds(n.id).length - 1}" title="delete this node${kids.length ? ' and everything under it' : ''}">✕</button>`}
      </span>
    </div>`;
  };

  const isToSortTop = (n) => n.parentId === null && (n.title || n.content).startsWith('to sort');
  const walk = (pid, depth) => {
    let ks = kidsOf(pid ?? null).filter(n => n.status !== 'removed');
    if (pid === null || pid === undefined) ks = [...ks.filter(n => !isToSortTop(n)), ...ks.filter(isToSortTop)];
    return ks.map(n => {
    const head = row(n, depth);
    if (kidsOf(n.id).length && folded.has(n.id)) return head;
    return head + walk(n.id, depth + 1).join('');
  });
  };
  const isToSort = (n) => (n.title || n.content).startsWith('to sort');
  const walkRoot = (depth) => S.nodes.filter(n => n.parentId === null && n.status !== 'removed')
    .sort((a, b) => (isToSort(a) ? 1 : 0) - (isToSort(b) ? 1 : 0))
    .map(n => {
    const head = row(n, depth);
    if (kidsOf(n.id).length && folded.has(n.id)) return head;
    return head + walk(n.id, depth + 1).join('');
  });

  let html;
  if (zoomId && node(zoomId)) {
    const z = node(zoomId);
    // M130 (Jacob): the zoom root's caret must work like every other —
    // rendering ignored its fold state, so collapsing it did nothing.
    html = row(z, 0) + (folded.has(zoomId) ? '' : walk(zoomId, 1).join(''));
    // M47: "to sort" stays visible even when zoomed — off-scope arrivals are
    // never invisible.
    const toSort = S.nodes.find(n => n.parentId === null && n.status !== 'removed' && (n.title || n.content).startsWith('to sort'));
    if (toSort && toSort.id !== zoomId && !pathOf(zoomId).some(x => x.id === toSort.id)) {
      html += `<div class="folded-line" style="margin-top:8px">— pinned —</div>` + row(toSort, 0) + (folded.has(toSort.id) ? '' : walk(toSort.id, 1).join(''));
    }
  } else {
    html = walkRoot(0).join('');
  }
  html += `<button id="add-root" title="add an unnamed node and focus the conversation there — the map names it from what you talk about next">+ add node${zoomId ? ' here' : ''}</button>`;
  tree.innerHTML = html || '<div class="empty">no map yet — press “+ add node” to begin</div>';
  const f = node(focus);
  $('focus-label').textContent = f ? `· focused on “${disp(f)}”` : '';
}

function renderAll() { applyAutoFold(); renderCrumbs(); renderTree(); renderNudges(); renderSwitchers(); renderMobTop(); paintInfluence(); }
// M88: one server, many projects (each its own map) and many chats (views).
function renderSwitchers() {
  const ps = $('proj-sel');
  if (!ps) return;
  const curProj = (S.projects || []).find(p => p.id === S.projectId);

// M138: markdown for OUR chat — a safe subset rendered locally. Escape
// FIRST, then transform; nothing external, nothing executable survives.
function md2html(t) {
  // Preferred path: battle-tested parsing (vendored marked) + sanitization
  // (vendored DOMPurify) — don't reinvent the wheel (Mark). The regex subset
  // below stays as the offline/degraded fallback.
  if (window.marked && window.DOMPurify) {
    const html = window.DOMPurify.sanitize(window.marked.parse(t, { breaks: true, mangle: false, headerIds: false }),
      { ALLOWED_ATTR: ['href', 'class'], FORBID_TAGS: ['style', 'img'] });
    return html.replace(/<a /g, '<a target="_blank" rel="noopener" ');
  }
  let x = esc(t);
  x = x.replace(/```\w*\n?([\s\S]*?)```/g, (_, code) => `<pre class="code">${code.replace(/\n$/, '')}</pre>`);
  x = x.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  x = x.replace(/^#{1,4} (.*)$/gm, '<strong>$1</strong>');
  x = x.replace(/^[-*] (.*)$/gm, '<span class="li">• $1</span>');
  x = x.replace(/^(\d+)\. (.*)$/gm, '<span class="li">$1. $2</span>');
  return x;
}
function msgHtml(role, content) {
  if (role === 'system') return `<div class="msg system">— ${esc(content)} —</div>`;
  if (role === 'assistant') return `<div class="msg assistant" data-raw="${esc(content)}">${md2html(content)}<button class="mcopy" title="copy this message">⧉</button></div>`;
  return `<div class="msg ${role}">${esc(content)}</div>`;
}

// ---- tree interactions ----
// M136 (Jacob): undo — confirm rarely, undo generously. After any destructive
// action the status line becomes a one-click ↩ toast; Ctrl/Cmd+Z and the ⋯/☰
// rows undo the latest from anywhere.
async function doUndo() {
  try {
    const r = await post('/api/undo', {});
    $('round-line').textContent = `↩ undone: ${r.label}`;
  } catch (err) { $('round-line').textContent = err.message === 'nothing to undo' ? 'nothing to undo' : `undo failed: ${err.message}`; }
}
function undoToast(label) {
  if (!label) return;
  const rl = $('round-line');
  rl.innerHTML = `${esc(label)} · <span id="undo-chip" style="color:var(--accent);cursor:pointer;font-style:normal;font-weight:600">↩ undo</span>`;
  rl.querySelector('#undo-chip').onclick = (e) => { e.stopPropagation(); doUndo(); };
}
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    e.preventDefault();
    doUndo();
  }
});

$('tree').addEventListener('click', async (e) => {
  const t = e.target;
  if (t.id === 'add-root') { await addNode(zoomId ?? null); return; }
  // M135b: mobile rows are plain text — tap decides by what the row IS:
  // parents fold/unfold, leaves open their action sheet. Suggestion dots
  // keep their direct tap everywhere.
  if (document.body.classList.contains('mobile') && !t.closest('.sdot') && !t.closest('#sheet-ov')
      && !t.closest('.rowbtn') && !t.closest('.caret')) { // control clicks (incl. synthetic from the sheet) pass through
    const mrow = t.closest('.nrow');
    if (mrow) {
      const id = mrow.querySelector('[data-edit]')?.dataset.edit;
      if (id) {
        if (kidsOf(id).length) {
          if (folded.has(id)) { folded.delete(id); userUnfolded.add(id); userFolded.delete(id); }
          else { folded.add(id); userFolded.add(id); userUnfolded.delete(id); }
          renderTree();
        } else openRowSheet(id);
        return;
      }
    }
  }
  const sheetId = t.closest('[data-sheet]')?.dataset.sheet;
  if (sheetId) { openRowSheet(sheetId); return; }
  const foldId = t.closest('[data-fold]')?.dataset.fold;
  if (foldId) {
    if (folded.has(foldId)) { folded.delete(foldId); userUnfolded.add(foldId); userFolded.delete(foldId); }
    else if (kidsOf(foldId).length) { folded.add(foldId); userFolded.add(foldId); userUnfolded.delete(foldId); }
    renderTree(); return;
  }
  const homeId = t.closest('[data-sethome]')?.dataset.sethome;
  if (homeId) {
    const on = S.home !== homeId;
    try { await post('/api/home', { nodeId: on ? homeId : null }); $('round-line').textContent = on ? `home page set to “${disp(node(homeId))}”` : 'home unset — the home page is the whole map again'; }
    catch (err) { $('round-line').textContent = `failed: ${err.message}`; }
    return;
  }
  const focusId = t.closest('[data-focus]')?.dataset.focus;
  if (focusId && S.mainChatId) {
    const c = chat();
    const name = disp(node(focusId));
    if (c && c.focusContainerId !== focusId) {
      if (!confirm(`Move the conversation's focus to “${name}”?\n(The agent pivots there on your next message.)`)) return;
      c.focusContainerId = focusId;            // optimistic
      userUnfolded.clear(); userFolded.clear();
      renderAll();
      $('round-line').textContent = `focus → “${name}” (the chat agent pivots on your next message)`;
      try { await post(`/api/chats/${S.mainChatId}/focus`, { nodeId: focusId }); }
      catch (err) { $('round-line').textContent = `focus change failed: ${err.message}`; }
    }
    return;
  }
  const favId = t.closest('[data-fav]')?.dataset.fav;
  if (favId) {
    const on = !(S.favorites || []).includes(favId);
    try { await post(`/api/nodes/${favId}/favorite`, { on }); $('round-line').textContent = on ? 'pinned to favorites (shown first in 🔍 search)' : 'unpinned from favorites'; }
    catch (err) { $('round-line').textContent = `favorite failed: ${err.message}`; }
    return;
  }
  const litId = t.closest('[data-lit]')?.dataset.lit;
  if (litId && S.mainChatId) {
    const on = !t.closest('[data-lit]').dataset.on;
    try { await post(`/api/chats/${S.mainChatId}/lit`, { nodeId: litId, on }); }
    catch (err) { $('round-line').textContent = `lighting failed: ${err.message}`; }
    return;
  }
  // Z1(ii)+Z2 (+ correction): dedicated zoom button. Zoom dims everything
  // outside the subtree; the focus shift is only SUGGESTED.
  const zoomTo = t.closest('[data-zoomin]')?.dataset.zoomin;
  if (zoomTo && S.mainChatId) {
    const name = disp(node(zoomTo));
    setZoom(zoomTo);
    const c = chat();
    const wantFocus = c && c.focusContainerId !== zoomTo
      && confirm(`Zoomed into “${name}”. Also move the conversation's focus here?\n(Zoom only changes your view; focus re-aims the chat agent.)`);
    if (wantFocus) { c.focusContainerId = zoomTo; userUnfolded.clear(); userFolded.clear(); renderAll(); }
    $('round-line').textContent = wantFocus
      ? `zoomed into “${name}” — focus moved here, other topics dimmed`
      : `zoomed into “${name}” — other topics dimmed (focus unchanged)`;
    try { await post(`/api/chats/${S.mainChatId}/zoomin`, { nodeId: zoomTo, focus: !!wantFocus }); }
    catch (err) { $('round-line').textContent = `zoom-in failed on the server: ${err.message}`; }
    return;
  }
  const addTo = t.closest('[data-add]')?.dataset.add;
  if (addTo) { await addNode(addTo); return; }
  const reorg = t.closest('[data-reorg]');
  if (reorg) { openReorganize(reorg.dataset.reorg, reorg.dataset.name); return; }
  const sugId = t.closest('[data-sug]')?.dataset.sug;
  if (sugId) { openSuggestion(sugId); return; }
  const promoteId = t.closest('[data-promote]')?.dataset.promote;
  if (promoteId) {
    if (!confirm(`Make “${disp(node(promoteId))}” a top-level topic of your map?`)) return;
    try { await post(`/api/nodes/${promoteId}/place`, { parentId: null }); $('round-line').textContent = 'promoted to a top-level topic'; }
    catch (err) { $('round-line').textContent = `promote failed: ${err.message}`; }
    return;
  }
  const placeId = t.closest('[data-place]')?.dataset.place;
  if (placeId) { openPlacePicker(placeId); return; }
  const mv = t.closest('[data-move]');
  if (mv) { openNodeMove(mv.dataset.move, mv.dataset.name); return; }
  const mrg = t.closest('[data-merge]');
  if (mrg) { openNodeMerge(mrg.dataset.merge, mrg.dataset.name); return; }
  const ndel = t.closest('[data-ndel]');
  if (ndel) {
    const delId = ndel.dataset.ndel;
    const count = Number(ndel.dataset.count);
    const doDelete = async () => {
      if (zoomId && (zoomId === delId || pathOf(zoomId).some(x => x.id === delId))) setZoom(null);
      try { const r = await post(`/api/nodes/${delId}/delete`, {}); undoToast(r.undo); }
      catch (err) { $('round-line').textContent = `delete failed: ${err.message}`; }
    };
    // M123 (Jacob): a session may be FOCUSED inside what's being deleted —
    // warn, explain the rescue, and offer to close those sessions too.
    const sub = new Set(subtreeIds(delId));
    const affected = (S.chats || []).filter(c => sub.has(c.focusContainerId));
    if (!affected.length) {
      const msg = count > 0
        ? `Delete “${ndel.dataset.name}” and the ${count} node(s) under it?\n(The agent will be told to drop it all.)`
        : `Delete “${ndel.dataset.name}” from the map?\n(The agent will be told to drop it.)`;
      if (confirm(msg)) await doDelete();
      return;
    }
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `
      <div class="modal" style="width:min(480px,94vw)">
        <h3>✕ delete “${esc(ndel.dataset.name)}”${count > 0 ? ` (+${count} inside)` : ''}</h3>
        <div style="font-size:13px;color:var(--danger)">⚠ ${affected.length} session(s) are focused inside what you're deleting:</div>
        <div style="font-size:13px;margin:6px 0">${affected.map(c => `
          <label style="display:flex;gap:8px;align-items:baseline;padding:2px 0;cursor:pointer">
            ${c.id === S.mainChatId
              ? `<span>▶ this session (focused on “${esc(disp(node(c.focusContainerId)))}”) — its focus moves to the parent</span>`
              : `<input type="checkbox" checked data-close-chat="${c.id}" style="vertical-align:-2px"> <span>session focused on “${esc(disp(node(c.focusContainerId)))}” — will be CLOSED with it (uncheck to keep it; it refocuses to the parent)</span>`}
          </label>`).join('')}</div>
        <div class="actions">
          <button id="dl-cancel" title="keep everything — nothing changes">cancel</button>
          <button id="dl-go" class="primary" title="delete the node(s) and close the checked sessions; unchecked ones refocus to the parent">delete</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#dl-cancel').onclick = () => ov.remove();
    ov.onclick = (e2) => { if (e2.target === ov) ov.remove(); };
    ov.querySelector('#dl-go').onclick = async () => {
      const closeIds = [...ov.querySelectorAll('input[data-close-chat]')].filter(cb => cb.checked).map(cb => cb.dataset.closeChat);
      ov.remove();
      await doDelete();
      for (const cid of closeIds) { try { await post(`/api/chats/${cid}/archive`, {}); } catch {} }
      if (closeIds.length) $('round-line').textContent = `deleted — and closed ${closeIds.length} session(s) that were focused inside`;
    };
    return;
  }
  const retype = t.closest('[data-retype]')?.dataset.retype;
  if (retype) {
    const n = node(retype);
    const nt = prompt('Category for this node (empty = plain topic):', n?.type ?? '');
    if (nt !== null && nt.trim() !== (n?.type ?? '')) await post(`/api/nodes/${retype}`, { type: nt.trim(), chatId: S.mainChatId });
    return;
  }
  const editId = t.closest('[data-edit]')?.dataset.edit;
  if (editId) {
    if ((S.recency || {})[editId]) post(`/api/nodes/${editId}/seen`, {}).catch(() => {});
    openNodeDetail(editId); return;
  }
});

// ---- place picker (M52+M53): the map agent fetches candidate homes; the
// user picks — full-map browse as fallback ----
function openPlacePicker(id) {
  const n = node(id);
  if (!n) return;
  // M54: exclude the item's own subtree (cycle) and the whole to-sort branch.
  const banned = new Set(subtreeIds(id));
  const walk = (pid, depth) => S.nodes
    .filter(x => x.parentId === pid && x.status !== 'removed' && !banned.has(x.id) && !(x.parentId === null && (x.title || x.content).startsWith('to sort')))
    .map(x => `<div class="lit-row" style="margin-left:${depth * 14}px"><span class="crumb" data-dest="${x.id}" style="cursor:pointer;color:var(--accent)">${esc(disp(x))}</span></div>` + walk(x.id, depth + 1)).join('');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>Where does “${esc(disp(n))}” belong?</h3>
    <div id="pp-sug" style="font-size:13px;color:var(--muted);font-style:italic">the placement agent is looking for likely homes…</div>
    <details style="margin-top:10px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">or browse the whole map</summary>
    ${walk(null, 0) || '<div class="empty">no destinations yet</div>'}
    </details>
    <div class="actions"><button id="pp-cancel" title="close without picking a place">cancel</button></div></div>`;
  document.body.appendChild(ov);
  fetch(`/api/nodes/${id}/suggest-home`).then(r => r.json()).then(r => {
    const el = ov.querySelector('#pp-sug');
    if (!el) return;
    if (r.candidates?.length) {
      el.style.fontStyle = 'normal';
      el.innerHTML = r.candidates.map(c => `
        <div style="border:1px solid var(--hair);border-radius:8px;padding:7px 10px;margin:4px 0;cursor:pointer" data-dest="${c.nodeId}">
          <b style="color:var(--accent)">${esc(c.name)}</b><br><span style="font-size:12px;color:var(--muted)">${esc(c.reason)}</span>
        </div>`).join('');
    } else {
      el.textContent = r.error ? `couldn't search: ${r.error}` : 'no natural home found — browse below, or ★ promote it to a top-level topic';
    }
  }).catch(() => {});
  ov.addEventListener('click', async (e) => {
    if (e.target === ov || e.target.id === 'pp-cancel') { ov.remove(); return; }
    const dest = e.target.closest('[data-dest]')?.dataset.dest;
    if (dest) {
      ov.remove();
      try { await post(`/api/nodes/${id}/place`, { parentId: dest }); $('round-line').textContent = `placed under “${disp(node(dest))}”`; }
      catch (err) { $('round-line').textContent = `place failed: ${err.message}`; }
    }
  });
}

// ---- node detail (M37): click a node → see + edit title and description ----
function openNodeDetail(id) {
  const n = node(id);
  if (!n) return;
  // M51: "to sort" is a system folder — show info, no editing.
  if (n.parentId === null && (n.title || n.content).startsWith('to sort')) {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal"><h3>to sort</h3>
      <p style="font-size:13px">System folder — the map's holding pen. Anything the filer can't place lands here, carrying a note of where it arrived from. ● dots on its items are placement suggestions: one click approves the move.</p>
      <p style="font-size:12px;color:var(--muted)">To move something out: click its ● dot and approve the suggested move (one click). Or ↖ on the item to pick a parent yourself, ⇧ to promote it to a topic — or light its destination and the map files it home on the next round. ⟳ tidy on this folder proposes a full cleanup.</p>
      <div class="actions"><button id="nd-cancel" class="primary" title="close this panel">close</button></div></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', (e) => { if (e.target === ov || e.target.id === 'nd-cancel') ov.remove(); });
    return;
  }
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3 style="display:flex;gap:8px;align-items:baseline">${n.type ? `<span style="color:var(--muted);font-size:12px">${esc(n.type)}</span>` : ''} <span>${esc(disp(n))}</span> <span style="color:var(--muted);font-size:12px;font-weight:400">(${esc(n.status)})</span></h3>
      <label style="font-size:12px;color:var(--muted)">Title (short — the map shows this)</label>
      <input id="nd-title" style="width:100%;border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink);font:inherit" value="${esc(n.title ?? '')}" placeholder="(auto-named from the description)">
      <div id="nd-sug" style="font-size:12px;color:var(--muted);margin-top:3px;font-style:italic">suggesting a name…</div>
      <label style="font-size:12px;color:var(--muted);margin-top:8px;display:block">Category (claim / question / option / … — or your own word; blank = plain topic)</label>
      <input id="nd-type" style="width:100%;border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink);font:inherit" value="${esc(n.type ?? '')}" placeholder="(none — plain topic)">
      <label style="font-size:12px;color:var(--muted);margin-top:8px;display:block">Status (open / decided / parked / … — or your own word; blank = no status)</label>
      <input id="nd-status" style="width:100%;border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink);font:inherit" value="${esc(n.status === 'live' ? '' : n.status ?? '')}" placeholder="(none)">
      <label style="font-size:12px;color:var(--muted);margin-top:8px;display:block">Description (the full statement — the agents read this)</label>
      <textarea id="nd-desc" rows="4" style="width:100%;border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical">${esc(n.content)}</textarea>
      <label style="font-size:12px;color:var(--muted);margin-top:8px;display:block">How it fits (parents above, children below — updates as they change)</label>
      <div id="nd-rel" style="border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:13px;color:var(--muted);font-style:italic">working out how this fits…</div>
      <label style="font-size:12px;color:var(--muted);margin-top:8px;display:block">Chat memory (what was discussed while this was the focus)</label>
      <div id="nd-mem" style="border:1px solid var(--hair);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:13px;color:var(--muted);font-style:italic">loading…</div>
      <div class="actions">
        <button id="nd-cancel" title="close without saving changes">cancel</button>
        <button id="nd-save" class="primary" title="save these edits to the node">save</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  // M38: fetch the relational description lazily (cached server-side by
  // neighborhood hash — instant when nothing nearby changed).
  fetch(`/api/nodes/${id}/relations`).then(r => r.json()).then(r => {
    const el = ov.querySelector('#nd-rel');
    if (el) { el.textContent = r.text ?? `couldn't work it out: ${r.error ?? '?'}`; el.style.fontStyle = 'normal'; el.style.color = 'var(--ink)'; }
  }).catch(() => {});
  // M41: per-node chat memory (read-only; the harness maintains it).
  fetch(`/api/nodes/${id}/memory`).then(r => r.json()).then(r => {
    const el = ov.querySelector('#nd-mem');
    if (el) {
      el.textContent = r.text ?? 'nothing yet — this fills in as you talk while focused here';
      if (r.text) { el.style.fontStyle = 'normal'; el.style.color = 'var(--ink)'; }
    }
  }).catch(() => {});
  // M40: suggested minimal title with an adopt button.
  fetch(`/api/nodes/${id}/suggest-title`).then(r => r.json()).then(r => {
    const el = ov.querySelector('#nd-sug');
    if (!el) return;
    if (r.title) {
      el.innerHTML = `suggested: “${esc(r.title)}” <button id="nd-adopt" style="border:1px solid var(--hair);background:var(--panel);color:var(--accent);border-radius:4px;cursor:pointer;font-size:11px;padding:0 6px" title="adopt this suggested short name for the node">use this</button>`;
      el.style.fontStyle = 'normal';
      el.querySelector('#nd-adopt').onclick = (ev) => { ev.preventDefault(); ov.querySelector('#nd-title').value = r.title; };
    } else el.textContent = '';
  }).catch(() => { const el = ov.querySelector('#nd-sug'); if (el) el.textContent = ''; });
  ov.addEventListener('click', async (e) => {
    if (e.target === ov || e.target.id === 'nd-cancel') { ov.remove(); return; }
    if (e.target.id === 'nd-save') {
      const title = ov.querySelector('#nd-title').value.trim();
      const content = ov.querySelector('#nd-desc').value.trim();
      const type = ov.querySelector('#nd-type').value.trim();
      const status = ov.querySelector('#nd-status').value.trim();
      const patch = { chatId: S.mainChatId };
      if (content && content !== n.content) patch.content = content;
      if (title !== (n.title ?? '')) patch.title = title;
      if (type !== (n.type ?? '')) patch.type = type;
      const shownStatus = n.status === 'live' ? '' : (n.status ?? '');
      if (status !== shownStatus) patch.status = status || 'live'; // blank = plain 'live'
      ov.remove();
      if (patch.content === undefined && patch.title === undefined && patch.type === undefined && patch.status === undefined) return;
      try { await post(`/api/nodes/${id}`, patch); }
      catch (err) { $('round-line').textContent = `edit failed: ${err.message}`; }
    }
  });
}

// ---- + new node (M34/M35: no name prompt, no zoom — adding is just adding;

// M114 (Jacob): no dialog, no naming choice — a new node is ALWAYS unnamed
// and ALWAYS becomes the focus; the map names it after the first conversation
// round aimed at it. (Click its text anytime to name it yourself.)
async function addNode(parentId) {
  const r = await post('/api/nodes', { parentId: parentId ?? undefined, focus: true });
  const c = chat(); if (c) c.focusContainerId = r.id; renderAll();
  $('round-line').textContent = parentId
    ? `unnamed node added under “${disp(node(parentId))}” and focused — your next conversation names it`
    : 'unnamed node added and focused — your next conversation names it';
}

// ---- lit-all / dim-all within the current view ----
async function litScope(on) {
  const tops = zoomId ? [zoomId] : S.nodes.filter(n => n.parentId === null).map(n => n.id);
  for (const id of tops) await post(`/api/chats/${S.mainChatId}/lit`, { nodeId: id, on, bulk: true });
  if (!on) $('round-line').textContent = 'dimmed the view — the focus path stays lit (protected)';
}
$('lit-all').onclick = () => litScope(true);
$('dim-all').onclick = () => litScope(false);

// M39: long-operation status with estimates + over-a-minute warning.
function opWatch(label, estimateSec) {
  const t0 = Date.now();
  $('round-line').textContent = `${label}… (estimated ~${estimateSec}s${estimateSec > 60 ? ' — WARNING: likely over a minute' : ''})`;
  const iv = setInterval(() => {
    const sec = Math.round((Date.now() - t0) / 1000);
    if (sec >= 60) $('round-line').textContent = `${label}… still running (${sec}s — over a minute; big maps make this slower)`;
    else if (sec >= estimateSec + 10) $('round-line').textContent = `${label}… taking longer than expected (${sec}s)`;
  }, 5000);
  return () => clearInterval(iv);
}

// M80 (Jacob): auto-light and auto-focus are propose→accept with a feedback
// loop, exactly like tidy — the user can talk back ("propose differently")
// before approving. Shared dialog, used by the header buttons AND talk-to-map.
function openSpecialistProposal(kind) {
  const isFocus = kind === 'focus', isZoom = kind === 'zoom';
  const specName = isFocus ? 'focus' : isZoom ? 'zoom' : 'lighting';
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal" style="width:min(520px,94vw)">
      <h3>${isFocus ? '▶ focus proposal' : isZoom ? '◱ zoom proposal' : '☀ lighting proposal'}</h3>
      <div style="font-size:12px;color:var(--muted);margin:-4px 0 8px">${
        isFocus ? 'the focus agent suggests where to aim the conversation — nothing changes until you apply'
        : isZoom ? 'the zoom agent suggests which subtree to show — view only, nothing changes until you apply'
        : 'the lighting agent suggests what the chat agent should and shouldn’t see — nothing changes until you apply'}</div>
      <div id="sp-body" style="font-size:13px;min-height:3em">…asking the ${specName} agent</div>
      <div class="actions" style="align-items:center">
        <input id="sp-feedback" placeholder="or tell it what you want instead…" style="flex:1;min-width:140px;border:1px solid var(--hair);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--ink);font:inherit" />
        <button id="sp-again" title="re-propose with your direction">↻</button>
        <button id="sp-cancel" title="close without applying — nothing changes">cancel</button>
        <button id="sp-apply" class="primary" disabled title="apply this proposal to the map">apply</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const body = ov.querySelector('#sp-body'), applyBtn = ov.querySelector('#sp-apply'), fb = ov.querySelector('#sp-feedback');
  let current = null, priorSummary = null;
  const fetchProposal = async (feedback) => {
    applyBtn.disabled = true;
    body.textContent = `…asking the ${specName} agent`;
    try {
      // M116 (Jacob): proposals were run-on sentences — unreadable. Now a
      // structured card: THE CHANGE first (target name big, its place on the
      // map under it, or vertical light/dim lists), the WHY separate, and a
      // one-line "what apply does".
      const crumbs = (id) => esc(pathOf(id).slice(0, -1).map(n => disp(n)).join(' › ')) || 'top level';
      const whyBlock = (why) => `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">why</span><div style="color:var(--muted);margin-top:2px">${esc(why)}</div></div>`;
      if (isFocus || isZoom) {
        const r = await post(`/api/chats/${S.mainChatId}/recommend`, { kind, feedback, priorSummary });
        current = r; priorSummary = `${kind} “${r.name}” — ${r.reason}`;
        const already = isFocus ? r.containerId === chat()?.focusContainerId : r.containerId === zoomId;
        current.already = already;
        body.innerHTML = `
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${isFocus ? 'aim the conversation at' : 'show only this subtree'}</div>
          <div style="font-size:16px;font-weight:600;margin:3px 0 1px">${isFocus ? '▶' : '◱'} ${esc(r.name)}</div>
          <div style="font-size:11px;color:var(--muted)">on the map: ${crumbs(r.containerId)}</div>
          ${already ? `<div style="margin-top:6px;color:var(--accent)">✓ this is already ${isFocus ? 'the focus' : 'your zoom'} — applying changes nothing</div>` : ''}
          ${whyBlock(r.reason)}
          <div style="font-size:11px;color:var(--muted);margin-top:8px">apply = ${isFocus ? 'focus moves there; the chat agent pivots on your next message. Your view does not change.' : 'your view shows just that subtree. Lighting and focus stay as they are.'}</div>`;
        applyBtn.disabled = false;
      } else {
        const r = await post(`/api/chats/${S.mainChatId}/autolit`, { preview: true, feedback, priorSummary });
        current = r;
        const lines = [r.lit.length ? `light: ${r.lit.map(x => `“${x.name}”`).join(', ')}` : '', r.dim.length ? `dim: ${r.dim.map(x => `“${x.name}”`).join(', ')}` : ''].filter(Boolean).join(' · ');
        priorSummary = `${r.summary} (${lines || 'no changes'})`;
        const list = (items, mark, label, note) => !items.length ? '' : `
          <div style="margin-top:6px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">${mark} ${label} (${items.length}) — ${note}</div>
          ${items.map(x => `<div style="padding:2px 0 0 14px">${mark} ${esc(x.name)} <span style="font-size:11px;color:var(--muted)">· ${crumbs(x.id)}</span></div>`).join('')}</div>`;
        body.innerHTML = r.lit.length + r.dim.length > 0
          ? list(r.lit, '☀', 'light up', 'the chat agent will see these')
            + list(r.dim, '◐', 'dim', 'the chat agent will stop seeing these — you still see everything')
            + whyBlock(r.summary)
          : `<div>✓ no changes needed — the lighting already fits.</div>${whyBlock(r.summary)}`;
        applyBtn.disabled = !(r.lit.length + r.dim.length);
      }
    } catch (err) { body.textContent = `failed: ${err.message}`; }
  };
  ov.querySelector('#sp-again').onclick = () => { const f = fb.value.trim(); fb.value = ''; fetchProposal(f || undefined); };
  fb.onkeydown = (e) => { if (e.key === 'Enter') ov.querySelector('#sp-again').click(); };
  ov.querySelector('#sp-cancel').onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  applyBtn.onclick = async () => {
    if (!current) { body.textContent = 'no proposal yet — ↻ re-propose or check the error above'; return; }
    if (current.already) { $('round-line').textContent = isFocus ? 'that is already the focus — nothing to change' : 'already zoomed there'; ov.remove(); return; }
    try {
      if (isFocus) {
        const c = chat(); if (c) c.focusContainerId = current.containerId;
        userUnfolded.clear(); userFolded.clear(); renderAll();
        await post(`/api/chats/${S.mainChatId}/focus`, { nodeId: current.containerId });
        $('round-line').textContent = `focus → “${current.name}” (the chat agent pivots on your next message)`;
      } else if (isZoom) {
        setZoom(current.containerId);
        await post(`/api/chats/${S.mainChatId}/zoomin`, { nodeId: current.containerId, focus: false });
        $('round-line').textContent = `zoomed the view into “${current.name}” (lighting unchanged)`;
      } else {
        const a = await post(`/api/chats/${S.mainChatId}/autolit`, { apply: { lit: current.lit.map(x => x.id), dim: current.dim.map(x => x.id) }, summary: current.summary });
        $('round-line').textContent = `auto-light: ${current.summary} (+${a.lit} lit, ${a.dim} dimmed)`;
      }
      ov.remove();
    } catch (err) { body.textContent = `apply failed: ${err.message}`; }
  };
  fetchProposal();
}

// ---- manage panel: focus AND lit for the whole map ----
$('lit-mgr-btn').onclick = () => {
  const lit = new Set(chat()?.lit ?? []);
  const focus = chat()?.focusContainerId;
  const walk = (pid, depth) => S.nodes.filter(n => n.parentId === pid && n.status !== 'removed').map(n => `
    <div class="lit-row" style="margin-left:${depth * 14}px">
      <span class="lit-toggle focus-t ${n.id === focus ? 'on' : ''}" data-mfocus="${n.id}" data-name="${esc(n.content)}" title="focus the conversation here">▶</span>
      <span class="lit-toggle ${lit.has(n.id) ? 'on' : ''}" data-mlit="${n.id}" title="light/dim as background">☀</span>
      <span>${n.type ? `<span style="color:var(--muted);font-size:11px">${esc(n.type)}:</span> ` : ''}${esc(disp(n))}</span>
    </div>` + walk(n.id, depth + 1)).join('');
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>Focus &amp; background — whole map</h3>
      <p style="font-size:12px;color:var(--muted)">▶ is where the conversation is aimed (one node). ☀ nodes are in the chat agent's background; lighting a node lights everything under it. Zoom doesn't change any of this — this panel always shows everything.</p>
      ${walk(null, 0) || '<div class="empty">no nodes yet</div>'}
      <div class="actions">
        <button id="lm-autolit" title="the lighting agent proposes background lighting for the current focus — you approve">☀ auto-light</button>
        <button id="lm-autofocus" title="the focus agent proposes where the conversation should aim — you approve">▶ auto-focus</button>
        <button id="lm-autozoom" title="the zoom agent proposes which subtree to isolate — you approve">◱ auto-zoom</button>
        <button id="lm-close" class="primary" title="close this panel">done</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', async (e) => {
    if (e.target.id === 'lm-close' || e.target === ov) { ov.remove(); return; }
    if (e.target.id === 'lm-autolit') { ov.remove(); autoLight(); return; }
    if (e.target.id === 'lm-autofocus') { ov.remove(); autoFocus(); return; }
    if (e.target.id === 'lm-autozoom') { ov.remove(); autoZoom(); return; }
    const litId = e.target.closest('[data-mlit]')?.dataset.mlit;
    if (litId) {
      const on = !e.target.closest('[data-mlit]').classList.contains('on');
      e.target.closest('[data-mlit]').classList.toggle('on', on); // optimistic
      await post(`/api/chats/${S.mainChatId}/lit`, { nodeId: litId, on });
      return;
    }
    const fEl = e.target.closest('[data-mfocus]');
    if (fEl && fEl.dataset.mfocus !== chat()?.focusContainerId) {
      if (!confirm(`Move the conversation's focus to “${fEl.dataset.name}”?`)) return;
      ov.querySelectorAll('[data-mfocus]').forEach((x) => x.classList.remove('on'));
      fEl.classList.add('on');
      const c = chat(); if (c) c.focusContainerId = fEl.dataset.mfocus;
      await post(`/api/chats/${S.mainChatId}/focus`, { nodeId: fEl.dataset.mfocus });
    }
  });
};

// M84 (Jacob): smart node search. Results ranked mechanically; confirm view
// shows the node with its parents and children; then light / zoom / focus /
// nothing. History + ★ favorites (pinned) like any dominant search function.
function openSearch(seedQuery) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal" style="width:min(560px,94vw)">
      <h3 style="display:flex;align-items:center;gap:8px">🔍 find a node
        <button id="sr-close" class="hbtn" style="margin-left:auto" title="close">✕</button>
      </h3>
      <input id="sr-input" placeholder="type to search… (★ favorites appear first)" />
      <div id="sr-list"></div>
    </div>`;
  document.body.appendChild(ov);
  const input = ov.querySelector('#sr-input'), list = ov.querySelector('#sr-list');
  ov.querySelector('#sr-close').onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  let t = null, lastResults = [];

  const run = async (record) => {
    const q = input.value.trim();
    const r = await post2get(`/api/search?q=${encodeURIComponent(q)}${record ? '&record=1' : ''}`);
    lastResults = r.results;
    list.innerHTML = '';
    if (!q) {
      if (r.results.length) {
        list.insertAdjacentHTML('beforeend', '<div class="sr-section">★ favorites</div>');
        r.results.forEach(renderRow);
      }
      if (r.history.length) {
