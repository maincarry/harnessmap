    stop();
    $('round-line').textContent = r.renamed + r.remaining === 0
      ? 'auto-rename: every node already has a short name'
      : `auto-rename: ${r.renamed} renamed${r.remaining ? ` — ${r.remaining} still long, press again` : ''}`;
  } catch (err) { stop(); $('round-line').textContent = `auto-rename failed: ${err.message}`; }
};

function openSuggestion(nodeId) {
  const s = sugFor(nodeId);
  if (!s) return;
  const name = disp(node(nodeId));
  const relight = s.kind === 'relight';
  const targetId8 = relight ? (s.note.match(/\[([0-9a-f]{8})/) || [])[1] : null;
  const target = targetId8 ? S.nodes.find(n => n.id.startsWith(targetId8)) : null;
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = relight ? `
    <div class="modal">
      <h3>Where “${esc(name)}” belongs</h3>
      <p style="font-size:13px">${esc(s.note)}</p>
      <p style="font-size:12px;color:var(--muted)">This couldn't be placed when it arrived, so it waits under "to sort". Approve to move it${target ? ` under “${esc(disp(target))}”` : ''} now — or ↖ on the node picks a different home.</p>
      <div class="actions">
        <button id="sg-dismiss" title="remove this suggestion — the dot disappears; the node stays in to sort">dismiss</button>
        <button id="sg-later" title="keep the dot — decide another time">keep for later</button>
        ${target ? `<button id="sg-place" class="primary" title="move it under the suggested branch now (the destination's lighting is unchanged)">↖ move under “${esc(disp(target))}”</button>` : ''}
      </div>
    </div>` : `
    <div class="modal">
      <h3>Restructure suggested: “${esc(name)}”</h3>
      <p style="font-size:13px">${esc(s.note)}</p>
      <p style="font-size:12px;color:var(--muted)">The auto-filer never restructures on its own — it flagged this for you. “See the proposal” runs tidy on this subtree with the suggestion in mind; you review before anything changes.</p>
      <div class="actions">
        <button id="sg-dismiss" title="remove this suggestion — the dot disappears">dismiss (remove dot)</button>
        <button id="sg-later" title="keep the dot — decide another time">keep for later</button>
        <button id="sg-tidy" class="primary" title="see the cleanup proposal, change by change — nothing applies until you approve">see the proposal</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', async (e) => {
    if (e.target === ov || e.target.id === 'sg-later') { ov.remove(); return; }
    if (e.target.id === 'sg-dismiss') {
      ov.remove();
      try { await post(`/api/suggestions/${s.id}`, { status: 'dismissed' }); }
      catch (err) { $('round-line').textContent = `dismiss failed: ${err.message}`; }
      return;
    }
    if (e.target.id === 'sg-place' && target) {
      ov.remove();
      try {
        await post(`/api/nodes/${nodeId}/move`, { parentId: target.id });
        await post(`/api/suggestions/${s.id}`, { status: 'done' });
        $('round-line').textContent = `moved “${name}” under “${disp(target)}”`;
      } catch (err) { $('round-line').textContent = `move failed: ${err.message}`; }
      return;
    }
    if (e.target.id === 'sg-tidy') { ov.remove(); openReorganize(nodeId, name, { hint: s.note, suggestionId: s.id, skipConfirm: true }); }
  });
}

// ---- reorganize modal ----
async function openReorganize(nodeId, name, opts = {}) {
  // M122: nodeId null = ROOT SCOPE — tidy the top level itself (the one place
  // the tidy agent may create top-level containers).
  const isRoot = !nodeId;
  const sz = isRoot ? S.nodes.filter(n => n.status !== 'removed').length : subtreeIds(nodeId).length;
  const est = Math.round(12 + sz * 1.5);
  const warn = est > 60 ? `\n\n⚠ This subtree has ${sz} nodes — expect roughly ${est}s (over a minute).` : '';
  if (!opts.skipConfirm && !confirm(isRoot ? `Tidy the top level? The tidy agent may propose domain containers to group your top-level threads — nothing changes until you apply.${warn}` : `Reorganize the “${name}” subtree? I'll propose a cleanup for your review — nothing changes until you apply.${warn}`)) return;
  const stop = opWatch(`preparing a cleanup proposal for “${name}”`, est);
  let p;
  try { p = await post('/api/reorganize/preview', { nodeId, hint: opts.hint, feedback: opts.feedback, priorSummary: opts.priorSummary, suggestionId: opts.suggestionId }); stop(); if (p.cached) $('round-line').textContent = 'proposal was precomputed — instant'; }
  catch (err) { stop(); $('round-line').textContent = `tidy failed: ${err.message}`; return; }
  const removalIdx = new Set(p.alterations.map((a, i) => (a.op === 'update_node' && a.status === 'removed') ? i : -1).filter(i => i >= 0));
  // M118 (Jacob): the proposal led with two raw tree dumps to diff by eye.
  // Now it leads with the changes themselves in plain words, one per row
  // (deletions keep their uncheck-to-keep boxes inline); the before/after
  // trees are still there, folded behind "see the full before → after".
  const clip = (t, n = 70) => { t = String(t ?? ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
  const nameOf = (id) => {
    const ex = node(id);
    if (ex) return clip(disp(ex), 50);
    const made = p.alterations.find(a => a.op === 'create_node' && a.id === id);
    return made ? clip(made.content, 50) : 'a node from this proposal';
  };
  const changeRow = (a, idx) => {
    const wrap = (mark, html, color) => `<div style="padding:3px 0;display:flex;gap:8px;align-items:baseline"><span style="color:${color};min-width:14px">${mark}</span><span>${html}</span></div>`;
    if (a.op === 'create_node') return wrap('+', `new node “${esc(clip(a.content))}”${a.parentId ? ` under “${esc(nameOf(a.parentId))}”` : ''}`, 'var(--accent)');
    if (a.op === 'move_node') return wrap('→', `move “${esc(nameOf(a.id))}” ${a.parentId ? `under “${esc(nameOf(a.parentId))}”` : 'to the top level'}`, 'var(--accent)');
    if (a.op === 'update_node' && a.status === 'removed') {
      const subDel = new Set(subtreeIds(a.id));
      const hits = (S.chats || []).filter(c => subDel.has(c.focusContainerId)).length;
      return `<label style="padding:3px 0;display:flex;gap:8px;align-items:baseline;cursor:pointer"><span style="color:var(--danger);min-width:14px">−</span><span><input type="checkbox" checked data-ridx="${idx}" style="vertical-align:-2px"> delete “${esc(nameOf(a.id))}” <span style="font-size:11px;color:var(--muted)">(uncheck to keep it)</span>${hits ? `<span style="font-size:11px;color:var(--danger)"> ⚠ ${hits} session(s) focused here — they will refocus to the parent</span>` : ''}</span></label>`;
    }
    if (a.op === 'update_node' && a.content !== undefined)
      return wrap('~', `reword “${esc(nameOf(a.id))}” to “${esc(clip(a.content))}”`, 'var(--muted)');
    if (a.op === 'update_node')
      return wrap('~', `mark “${esc(nameOf(a.id))}”${a.status ? ` as ${esc(a.status)}` : ''}${a.type !== undefined ? ` · category: ${esc(a.type || 'none')}` : ''}`, 'var(--muted)');
    return wrap('·', esc(a.op), 'var(--muted)');
  };
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>⟳ tidy proposal — “${esc(name)}”</h3>
      <div style="font-size:12px;color:var(--muted);margin:-4px 0 8px">the tidy agent proposes ${p.alterations.length} change(s) to this subtree — nothing changes until you apply</div>
      <div style="font-size:13px">${p.alterations.length ? p.alterations.map((a, i) => changeRow(a, i)).join('')
        : `<div style="color:var(--muted)">the tidy agent proposes NO changes ${isRoot ? 'to the top level' : 'inside this subtree'}.${!isRoot && node(nodeId)?.parentId === null ? ' If the suggestion was about grouping the top-level threads themselves, that needs the top level as the target — use the button below.' : ''}</div>
          ${!isRoot && node(nodeId)?.parentId === null ? `<button id="ro-root-bridge" class="hbtn" style="margin-top:8px" title="re-run this cleanup with the whole top level as the target — only there can threads be grouped under new containers">⟳ run tidy top level instead</button>` : ''}`}</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)"><span style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">why</span><div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(p.summary)}</div></div>
      <details style="margin-top:8px"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">see the full before → after</summary>
        ${(() => {
          // M121 (Jacob): the server's preview text is the AGENT serialization
          // (glyphs, status tags, full statements) — not for humans. Build both
          // trees from real node data instead, in the map's own visual
          // language (short display names, category chips), and mark changes
          // from the alterations themselves: − leaving, + arriving, → moving,
          // ~ reworded. Node-level truth, no text matching.
          const base = (isRoot ? S.nodes.filter(n => n.status !== 'removed').map(n => ({ ...n })) : subtreeIds(nodeId).map(id => ({ ...node(id) })).filter(n => n && n.status !== 'removed'));
          const afterMap = new Map(base.map(n => [n.id, { ...n }]));
          const marks = new Map();   // id → 'del' | 'new' | 'moved' | 'reword'
          for (const a of p.alterations) {
            if (a.op === 'create_node') { afterMap.set(a.id, { id: a.id, parentId: a.parentId ?? nodeId ?? null, content: a.content, title: a.title, type: a.type, status: a.status ?? 'live' }); marks.set(a.id, 'new'); }
            else if (a.op === 'move_node' && afterMap.has(a.id)) { afterMap.get(a.id).parentId = a.parentId; if (!marks.has(a.id)) marks.set(a.id, 'moved'); }
            else if (a.op === 'update_node' && a.status === 'removed') { afterMap.delete(a.id); marks.set(a.id, 'del'); }
            else if (a.op === 'update_node' && afterMap.has(a.id)) { Object.assign(afterMap.get(a.id), a.content !== undefined ? { content: a.content } : {}, a.title !== undefined ? { title: a.title } : {}, a.type !== undefined ? { type: a.type } : {}, a.status !== undefined ? { status: a.status } : {}); if (!marks.has(a.id) && (a.content !== undefined || a.title !== undefined)) marks.set(a.id, 'reword'); }
          }
          const clip50 = (t) => clip(t, 60);
          const treeRows = (nodes, mode) => {
            const kidsIn = (pid) => nodes.filter(n => n.parentId === pid);
            const rowFor = (n, depth) => {
              const m = marks.get(n.id);
              const gone = mode === 'before' && m === 'del';
              const hot = mode === 'after' && (m === 'new' || m === 'moved' || m === 'reword');
              const mk = mode === 'after' ? (m === 'new' ? '+' : m === 'moved' ? '→' : m === 'reword' ? '~' : '') : (gone ? '−' : '');
              return `<div style="padding:1px 0 1px ${8 + depth * 16}px;border-left:2px solid ${hot ? 'var(--accent)' : gone ? 'var(--danger)' : 'transparent'};${gone ? 'color:var(--danger);text-decoration:line-through;opacity:.75' : hot ? 'color:var(--accent)' : ''}">${mk ? `<b>${mk} </b>` : ''}${n.type ? `<span style="font-size:9px;border:1px solid var(--hair);border-radius:3px;padding:0 3px;margin-right:4px">${esc(n.type)}</span>` : ''}${esc(clip50(n.title || n.content))}</div>`;
            };
            const walkP = (pid, depth) => kidsIn(pid).map(n => rowFor(n, depth) + walkP(n.id, depth + 1)).join('');
            const root = isRoot ? null : nodes.find(n => n.id === nodeId);
            return (root ? rowFor(root, 0) : '') + walkP(isRoot ? null : nodeId, root ? 1 : 0);
          };
          return `<div style="font-size:11px;color:var(--muted);margin:6px 0 4px">short names, like the map itself — <span style="color:var(--danger)">− red leaves</span> · <span style="color:var(--accent)">+ arrives · → moves · ~ reworded</span>; everything else is untouched</div>
            <div class="cols">
              <div><b style="font-size:12px">before (as it is now)</b><div style="font-size:12px;line-height:1.6;margin-top:4px;max-height:40vh;overflow:auto">${treeRows(base, 'before')}</div></div>
              <div><b style="font-size:12px">after (if you apply)</b><div style="font-size:12px;line-height:1.6;margin-top:4px;max-height:40vh;overflow:auto">${treeRows([...afterMap.values()], 'after')}</div></div>
            </div>`;
        })()}
      </details>
      <div style="position:sticky;bottom:-18px;background:var(--panel);padding:10px 0 12px;margin-bottom:-18px;border-top:1px solid var(--hair)">
        <div style="display:flex;gap:6px">
          <input id="ro-feedback" placeholder="different idea? tell the tidy agent — e.g. 'group by price instead'" style="flex:1;border:1px solid var(--hair);border-radius:8px;padding:6px 10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px">
          <button id="ro-again" style="border:1px solid var(--hair);border-radius:8px;padding:6px 12px;cursor:pointer;background:var(--panel);color:var(--accent)" title="tell the tidy agent what you want instead — it rebuilds the proposal around your words">↻ re-propose</button>
        </div>
        <div class="actions" style="margin-top:8px">
          <button id="ro-cancel" title="close without applying — the map is untouched">cancel</button>
          <button id="ro-apply" class="primary" title="apply only the checked changes to the map">apply ${p.alterations.length} change(s)</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const goAgain = () => {
    const fb = ov.querySelector('#ro-feedback').value.trim();
    if (!fb) return;
    ov.remove();
    openReorganize(nodeId, name, { ...opts, skipConfirm: true, feedback: fb, priorSummary: p.summary });
  };
  ov.querySelector('#ro-again').onclick = goAgain;
  const bridge = ov.querySelector('#ro-root-bridge');
  if (bridge) bridge.onclick = () => { ov.remove(); openReorganize(null, 'the top level', { skipConfirm: true, hint: opts.hint }); };
  ov.querySelector('#ro-feedback').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); goAgain(); } });
  ov.querySelector('#ro-cancel').onclick = () => { ov.remove(); $('round-line').textContent = 'reorganize cancelled'; };
  ov.querySelector('#ro-apply').onclick = async () => {
    const keep = new Set([...ov.querySelectorAll('input[data-ridx]')].filter(cb => cb.checked).map(cb => Number(cb.dataset.ridx)));
    const chosen = p.alterations.filter((a, idx) => !removalIdx.has(idx) || keep.has(idx));
    try {
      const ra = await post('/api/reorganize/apply', { alterations: chosen, chatId: S.mainChatId, containerName: name, suggestionId: opts.suggestionId });
      undoToast(ra.undo);
    } catch (err) { $('round-line').textContent = `apply failed: ${err.message}`; }
    ov.remove();
  };
}

// M97/M98: sessions — each is a view (own focus+lighting) with an optional
// live Claude Code terminal bound to it via the cwd claim mechanism.
const chatTerms = new Map(); // chatId -> {el, xt, ws, fit, termId, cwd}
let activeTab = 'session';   // 'session' = the active chat's surface
function showSession(chatId) {
  activeTab = 'session';
  const t = chatTerms.get(chatId);
  const showTerm = !!t;
  $('messages').style.display = showTerm ? 'none' : '';
  $('composer').style.display = showTerm ? 'none' : '';
  document.querySelectorAll('.termhost').forEach(el => el.classList.toggle('on', showTerm && el === t.el));
  renderTabs();
  if (t) { t.xt.focus(); fitTerm(t); }
}
function fitTerm(t) {
  if (!t.el.offsetWidth) return;
  try {
    t.fit.fit();
    t.ws?.send?.(JSON.stringify({ t: 'rs', c: t.xt.cols, r: t.xt.rows }));
  } catch {}
}
// M102 (Mark): resize storms (drag, maximize animations) were spamming the
// PTY with intermediate sizes and could leave the TUI garbled at the settled
// size. Debounce to the FINAL size only; refit() also nudges rows by one and
// back, which forces the TUI to fully repaint (the tmux trick) — scrollback
// intact.
function scheduleFit(t) {
  clearTimeout(t.fitTimer);
  t.fitTimer = setTimeout(() => fitTerm(t), 160);
}
function refitTerm(t) {
  if (!t.el.offsetWidth) return;
  try {
    t.fit.fit();
    const c = t.xt.cols, r = t.xt.rows;
    t.ws?.send?.(JSON.stringify({ t: 'rs', c, r: Math.max(2, r - 1) }));
    setTimeout(() => { try { t.ws?.send?.(JSON.stringify({ t: 'rs', c, r })); } catch {} }, 60);
  } catch {}
}
window.addEventListener('resize', () => { const t = chatTerms.get(S.mainChatId); if (t && activeTab === 'session') scheduleFit(t); });

function attachTerm(chatId, termId, cwd) {
  const host = document.createElement('div');
  host.className = 'termhost'; host.dataset.term = termId;
  $('chat-pane').appendChild(host);
  const xt = new Terminal({ fontSize: 13, theme: { background: '#000000' }, scrollback: 5000, allowProposedApi: true });
  const fit = new (window.FitAddon?.FitAddon ?? FitAddon)();
  xt.loadAddon(fit);
  xt.open(host);
  const ws = new WebSocket(`ws://${location.host}/term?id=${termId}`);

    }
    const rows = $('dev-rows');
    const key = traces.map(t => t.id).join(',') + '|' + filter;
    if (rows.dataset.key === key) return;   // don't rebuild (and collapse open rows) when nothing changed
    rows.dataset.key = key;
    if (!traces.length) { rows.innerHTML = '<div style="color:var(--muted);font-size:12px">no traces yet' + (filter ? ' for this task' : '') + ' — recording is on; traces appear as the map agents run.</div>'; return; }
    rows.innerHTML = '';
    for (const t of traces) {
      const el = document.createElement('details');
      el.className = 'dev-row';
      const when = t.ts ? new Date(t.ts + 'Z').toLocaleTimeString() : '';
      const cast = DEV_CAST[t.task] ?? { who: `server → ${t.task}`, does: '' };
      el.innerHTML = `<summary><span class="dv-task">${esc(cast.who)}</span>
        <span class="dv-meta">${esc(cast.does)}${t.kind !== 'inject' && t.model ? ` · ${esc(t.model)}` : ''}${t.ms != null ? ` · ${t.ms}ms` : ''} · ${when}</span>
        ${t.ok === 0 ? '<span class="dv-fail">✗ failed</span>' : ''}</summary>`
        + (t.system ? `<div class="dv-sec">the agent’s standing instructions (system prompt)</div><pre>${esc(t.system)}</pre>` : '')
        + (t.user ? `<div class="dv-sec">${t.kind === 'inject' ? 'which chat session received it' : 'what the server sent it (input)'}</div><pre>${esc(t.user)}</pre>` : '')
        + (t.response ? `<div class="dv-sec">${t.kind === 'inject' ? 'the exact context slipped into the chat agent’s next turn' : (t.ok === 0 ? 'the error it returned' : 'what it returned (response)')}</div><pre>${esc(t.response)}</pre>` : '');
      rows.appendChild(el);
    }
  };
  $('dev-filter').onchange = refresh;
  panel.querySelector('#dev-mobile').onclick = () => openPhoneSim();
  $('dev-close').onclick = closeDevPanel;
  $('dev-off').onclick = async () => { await post('/api/dev/toggle', {}); closeDevPanel(); $('round-line').textContent = 'dev mode off — recording stopped (traces kept until restart cap)'; };
  await refresh();
  devTimer = setInterval(refresh, 2500);
}
$('dev-btn').onclick = async () => {
  $('other-menu').hidden = true;
  if ($('dev-panel')) { closeDevPanel(); return; }
  const st = await post2get('/api/dev');
  if (!st.on) await post('/api/dev/toggle', {});
  openDevPanel();
};

// ---- turn-lifecycle beat (M62): visual per-turn health ----
// states: idle → prompt (message seen, agent replying) → observed (reply
// landed, filing) → filed ✓. Staleness: prompt seen but nothing observed for
// minutes = the observation pipe may be broken — say so loudly.
let beatState = 'idle', beatAt = 0, lastFiledAt = 0;
function setBeat(st) { beatState = st; beatAt = Date.now(); renderBeat(); }
function renderBeat() {
  const el = $('beat');
  if (!el) return;
  const age = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's' : Math.round(s / 60) + 'm'; };
  const steps = (a, b, c) => `<span class="step ${a}">✉ seen</span> · <span class="step ${b}">💬 replying</span> · <span class="step ${c}">▤ filing</span>`;
  el.classList.remove('stale');
  if (beatState === 'prompt') {
    if (Date.now() - beatAt > 240000) { el.classList.add('stale'); el.innerHTML = '⚠ message seen but no reply observed — is the map plugged in?'; return; }
    el.innerHTML = steps('done', 'on', '');
  } else if (beatState === 'observed') {
    el.innerHTML = steps('done', 'done', 'on');
  } else if (beatState === 'filed') {
    el.innerHTML = `✓ filed ${age(lastFiledAt)} ago`;
  } else {
    el.innerHTML = lastFiledAt ? `✓ filed ${age(lastFiledAt)} ago` : 'waiting for activity';
  }
}
setInterval(renderBeat, 5000);

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'map') {
      const prevChat = S.mainChatId;
      S = m;
      if (zoomId && !node(zoomId)) setZoom(null);
      renderAll();
      if (S.mainChatId && S.mainChatId !== prevChat) { loadTurns(); showSession(S.mainChatId); }
    } else if (m.type === 'turn' && m.chatId === S.mainChatId) {
      if (beatState === 'prompt') setBeat('observed');
      document.querySelector('.msg.pending')?.remove();
      document.querySelector('.msg.hostpending')?.remove();
      const i = sentLocal.indexOf(m.content);
      if (m.role === 'user' && i >= 0) { sentLocal.splice(i, 1); return; }
      const box = $('messages');
      box.querySelector('.empty')?.remove();
      if (m.role === 'assistant') box.querySelector('.msg.streaming')?.remove(); // the final turn replaces the live draft
      box.insertAdjacentHTML('beforeend', msgHtml(m.role, m.content));
      box.scrollTop = box.scrollHeight;
    } else if (m.type === 'chat_delta' && m.chatId === S.mainChatId) {
      // M139: the reply builds up live, block by block, rendered as it grows.
      const box = $('messages');
      document.querySelector('.msg.pending')?.remove();
      document.querySelector('.msg.hostpending')?.remove();
      let st = box.querySelector('.msg.streaming');
      if (!st) { box.querySelector('.empty')?.remove(); box.insertAdjacentHTML('beforeend', '<div class="msg assistant streaming" data-raw=""></div>'); st = box.querySelector('.msg.streaming'); }
      st.dataset.raw += m.text;
      st.innerHTML = md2html(st.dataset.raw);
      box.scrollTop = box.scrollHeight;
    } else if (m.type === 'round') {
      lastFiledAt = Date.now(); setBeat('filed');
      $('round-line').textContent = `↳ ${m.summary} (${m.alterations} change${m.alterations === 1 ? '' : 's'})`;
    } else if (m.type === 'lag') {
      const el = $('lag');
      el.textContent = m.lag > 0 ? `map is ${m.lag} round${m.lag === 1 ? '' : 's'} behind` : 'map current';
      el.classList.toggle('behind', m.lag > 0);
      if (m.lag > 0) $('round-line').textContent = 'filing the round onto the map…';
    } else if (m.type === 'host_prompt') {
      setBeat('prompt');
      // A host-harness session just took a user message — show life in the
      // mirror until the round's turns arrive.
      const box = $('messages');
      if (!document.querySelector('.msg.hostpending')) {
        box.querySelector('.empty')?.remove();
        box.insertAdjacentHTML('beforeend', '<div class="msg assistant pending hostpending">✍ message received in the terminal session — agent is replying…</div>');
        box.scrollTop = box.scrollHeight;
      }
      $('round-line').textContent = 'host session active — agent replying…';
    } else if (m.type === 'chat_cleared' && m.chatId === S.mainChatId) {
      loadTurns();
    } else if (m.type === 'translator_error') {
      $('round-line').textContent = 'translator error — map may lag (chat unaffected)';
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
  window.__wsInject = (m) => ws.onmessage({ data: JSON.stringify(m) }); // test hook (ui-smoke)
}

async function refresh() {
  S = await (await fetch('/api/state')).json();
  if (S.health?.filedAt) { lastFiledAt = S.health.filedAt; if (beatState === 'idle') renderBeat(); }
  if (zoomId && !node(zoomId)) setZoom(null);
  renderAll();
  await loadTurns();
}

connect();
refresh();
checkMobile();
window.TOUR = TOUR; window.tourShow = tourShow; window.tourStop = tourStop; window.__state = () => S; window.__refresh = refresh; window.__md = md2html; // test hooks (ui-smoke)
</script>
</body>
