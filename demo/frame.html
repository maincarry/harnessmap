<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>HarnessMap demo frame</title>
<style>
@font-face{font-family:'Sora';src:url('../public/fonts/sora-400-800-latin.woff2') format('woff2');font-weight:400 800;font-display:block}
@font-face{font-family:'IBM Plex Mono';src:url('../public/fonts/plex-400-latin.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'IBM Plex Mono';src:url('../public/fonts/plex-500-latin.woff2') format('woff2');font-weight:500;font-display:block}
:root{--bg:#0f161f;--panel:#151e29;--ink:#e3e9ef;--muted:#8fa0b0;--hair:#243140;--accent:#7cacf2}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sora',ui-sans-serif,system-ui,sans-serif;width:1440px;height:960px;overflow:hidden}
#stage{position:relative;width:1440px;height:960px}
#map{position:absolute;left:0;top:0;width:1440px;height:900px;border:0;background:var(--bg);display:block}
/* companion mode: the small window sits on a quiet desktop, scaled so it reads at video size */
body.companion #map{left:0;top:0;width:360px;height:420px;transform:translate(calc(720px - 180px*2.1), calc(450px - 210px*2.1)) scale(2.1);transform-origin:0 0;background:transparent}
body.companion #stage{background:radial-gradient(1200px 700px at 50% 40%, #16202c 0%, var(--bg) 70%)}
#cap{position:absolute;left:0;top:900px;width:1440px;height:60px;background:var(--bg);border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 48px}
#cap span{font-size:24px;font-weight:500;letter-spacing:-.01em;color:var(--ink);opacity:0;transition:opacity .45s ease;text-align:center;line-height:1.2}
#cap span.on{opacity:1}
#card{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;opacity:0;pointer-events:none;transition:opacity .6s ease}
#card.on{opacity:1}
#card .t{font-size:64px;font-weight:700;letter-spacing:-.03em;line-height:1.08;text-align:center;max-width:1100px;text-wrap:balance}
#card .s{font-size:22px;color:var(--muted);font-weight:400;letter-spacing:0}
#card .mark{width:84px;height:84px;color:var(--accent)}
#card .brand{font-size:40px;font-weight:700;letter-spacing:-.02em}
#card .brand b{color:var(--accent);font-weight:700}
#veil{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .5s ease}
#veil.on{opacity:1}
</style></head>
<body><div id="stage">
<iframe id="map" title="HarnessMap"></iframe>
<div id="cap"><span id="capt"></span></div>
<div id="veil"></div>
<div id="card"><div class="t" id="card-t"></div><div class="s" id="card-s"></div></div>
</div>
<script>
const q = new URLSearchParams(location.search);
const mapUrl = q.get('map') || 'http://127.0.0.1:8790/';
document.getElementById('map').src = mapUrl;
if (q.get('mode') === 'companion') document.body.classList.add('companion');
const MARK = '<svg class="mark" viewBox="0 0 72 72" fill="none" aria-hidden="true"><path d="M36 13 C52 13 59 25 57 38 C55 52 41 57 30 55 C18 53 13 41 15 29 C17 19 25 13 36 13Z" stroke="currentColor" stroke-width="2.6"/><circle cx="21" cy="44" r="3.8" fill="currentColor"/><circle cx="52" cy="35" r="3.4" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="40" cy="23" r="4.6" fill="currentColor"/><circle cx="40" cy="23" r="8.6" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>';
window.setCaption = (text) => { const el = document.getElementById('capt'); if (!text) { el.classList.remove('on'); return; } el.classList.remove('on'); setTimeout(() => { el.textContent = text; el.classList.add('on'); }, 220); };
window.showCard = (title, sub, withLogo) => { const c = document.getElementById('card'); document.getElementById('card-t').innerHTML = withLogo ? MARK + '<div class="brand">harness<b>map</b></div>' + (title ? '<div class="s" style="margin-top:6px">' + title + '</div>' : '') : title; document.getElementById('card-s').textContent = sub || ''; c.classList.add('on'); };
window.hideCard = () => document.getElementById('card').classList.remove('on');
window.veil = (on) => document.getElementById('veil').classList.toggle('on', !!on);
</script></body></html>
