<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>harnessmap companion</title>
<style>
:root{--panel:#fdfdfb;--panel2:#f4f6f1;--ink:#202b36;--muted:#5c6c7a;--faint:#8695a2;--hair:#dce1d9;--accent:#2560b8;--ok:#3f9d5a;--warn:#b57e22;
  --ease:cubic-bezier(.22,.9,.24,1);--spring:cubic-bezier(.34,1.4,.5,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1a1f27;--panel2:#222a33;--ink:#e8edf2;--muted:#8a97a5;--faint:#6f7d8a;--hair:#2a323c;--accent:#5aa2ff}}
:root[data-theme="dark"]{--panel:#1a1f27;--panel2:#222a33;--ink:#e8edf2;--muted:#8a97a5;--faint:#6f7d8a;--hair:#2a323c;--accent:#5aa2ff}
*{box-sizing:border-box}
@keyframes fadein{from{opacity:0;transform:translateY(3px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dpulse{50%{box-shadow:0 0 0 7px rgba(181,126,34,0)}}
@keyframes appear{0%{opacity:0;transform:scale(.4) translateY(26px)}45%{opacity:1;transform:scale(1.22)}68%{transform:scale(.96)}84%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes ring{0%{box-shadow:0 12px 34px rgba(10,15,25,.30),0 0 0 0 rgba(37,96,184,.55)}100%{box-shadow:0 12px 34px rgba(10,15,25,.30),0 0 0 46px rgba(37,96,184,0)}}
@keyframes minipulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
html,body{margin:0;height:100%;background:transparent}
body{font-family:'Sora',system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
#root{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;align-items:flex-end}
/* the whole widget announces itself when it first appears / is restored, so it's easy to spot */
.appearing .chip{animation:appear .8s var(--spring) both, ring 1.1s ease-out .1s 3}

/* chip (collapsed) — shows the FOCUS node name; drag it to move, click to open */
.chip{display:inline-flex;align-items:center;gap:10px;max-width:288px;background:var(--panel);border:1px solid var(--hair);border-radius:999px;
  padding:11px 17px 11px 12px;box-shadow:0 12px 34px rgba(10,15,25,.30);font-weight:600;font-size:15px;letter-spacing:-.01em;cursor:grab;
  transition:opacity .3s ease, transform .35s var(--ease);transform-origin:bottom right}
.chip:active{cursor:grabbing}
.chip .nm{color:var(--ink);display:inline-block;max-width:196px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;pointer-events:none}
.chip svg,.chip .filinglbl,.chip .infmark{pointer-events:none}
.filinglbl{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--warn);display:none;flex:0 0 auto}
.infmark{display:none;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--hair);border-radius:5px;padding:1px 5px;flex:0 0 auto}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--ok);box-shadow:0 0 0 3px rgba(63,157,90,.2);transition:background .3s, box-shadow .3s;pointer-events:none}
body.filing .dot{background:var(--warn);box-shadow:0 0 0 3px rgba(181,126,34,.22);animation:dpulse 1.1s ease-in-out infinite}
body.attn .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(37,96,184,.22)}
body.filing .filinglbl{display:inline;animation:fadein .4s var(--ease)}
body.infoff .chip .infmark{display:inline;animation:fadein .4s var(--ease)}
body.infoff .dot{background:#b9c2bd;box-shadow:0 0 0 3px rgba(150,160,155,.18)}

/* panel (expanded) */
.panel{width:288px;background:var(--panel);border:1px solid var(--hair);border-radius:16px;box-shadow:0 22px 60px rgba(10,15,25,.34);
  position:absolute;right:0;bottom:0;max-height:calc(100vh - 24px);overflow-y:auto;overflow-x:hidden;opacity:0;transform:scale(.94) translateY(12px);transform-origin:bottom right;pointer-events:none;
  transition:opacity .34s ease, transform .5s var(--spring)}
body.open .panel{opacity:1;transform:none;pointer-events:auto}
body.open .chip{opacity:0;transform:scale(.92) translateY(6px);pointer-events:none}
/* header sticks so the logo + close never scroll out of the short (300px) native window */
.hd{display:flex;align-items:center;gap:8px;padding:12px 14px 9px;position:sticky;top:0;z-index:3;background:var(--panel)}
.hd .draghandle{display:flex;align-items:center;gap:8px;flex:1;cursor:grab}
.hd .draghandle:active{cursor:grabbing}
.hd .brand{font-weight:800;font-size:12.5px;letter-spacing:-.01em;color:var(--muted)}
.hd .brand .b{color:var(--accent)}
.hd .icobtn{color:var(--faint);font-size:14px;cursor:pointer;line-height:1;padding:2px 4px;border-radius:6px}
.hd .icobtn:hover{background:var(--panel2);color:var(--ink)}
.focus{padding:0 14px 3px;font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.25;cursor:grab}
.status{padding:4px 14px 3px;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.status .inmap{color:var(--faint)}
.last{padding:2px 14px 11px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--faint);line-height:1.5;min-height:0}
.ver{padding:0 14px 12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);letter-spacing:.02em}
.open-b{display:block;margin:0 14px 9px;text-align:center;font-weight:600;font-size:13px;padding:10px;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
.inf{display:flex;align-items:center;gap:8px;margin:0 14px 6px;padding:9px 12px;border:1px solid var(--hair);border-radius:11px;background:var(--panel2);font-size:12.5px;font-weight:600;cursor:pointer}
.sw{margin-left:auto;width:38px;height:22px;border-radius:999px;background:var(--accent);position:relative;transition:background .3s;flex:0 0 auto}
.sw .knob{position:absolute;top:2px;left:18px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .28s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.3)}
body.infoff .sw{background:#c3ccc0}
body.infoff .sw .knob{left:2px}
.infnote{margin:-2px 14px 11px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);line-height:1.5;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s var(--ease),opacity .3s ease}
body.infoff .infnote{max-height:40px;opacity:1}
.talk{margin:0 14px 14px;border:1px solid var(--hair);border-radius:11px;background:var(--panel2);overflow:hidden;display:flex;flex-direction:column}
.mclog{display:none;flex-direction:column;gap:6px;max-height:190px;overflow-y:auto;padding:10px 12px;border-bottom:1px solid var(--hair)}
.mclog.show{display:flex}
.mclog .m{font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.mclog .m.you{align-self:flex-end;background:var(--accent);color:#fff;border-radius:10px 10px 3px 10px;padding:5px 9px;max-width:85%}
.mclog .m.map{align-self:flex-start;color:var(--ink);max-width:100%}
.mclog .m-prop{align-self:stretch;border:1px dashed var(--accent);border-radius:9px;padding:8px 10px;font-size:11.5px;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.mclog .m-prop.done{border-style:solid;border-color:var(--hair);color:var(--muted)}
.mclog .m-prop button{align-self:flex-start;border:none;border-radius:7px;padding:5px 12px;background:var(--accent);color:#fff;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer}
.mclog .m-prop button:disabled{opacity:.6;cursor:default}
.talk .row{display:flex;align-items:center;gap:8px;padding:8px 12px}
.talk input{flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink);outline:none}
.talk input::placeholder{color:var(--faint)}
.talk .snd{color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;background:0;border:0;font-family:inherit}
.offline{position:absolute;right:0;bottom:0;background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:8px 14px;font-size:12.5px;color:var(--muted);box-shadow:0 10px 30px rgba(10,15,25,.28);display:none}
body.offline .offline{display:inline-flex;align-items:center;gap:8px}
body.offline .chip,body.offline .panel{display:none}

</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<g id="mk">
 <path d="M36 13 C52 13 59 25 57 38 C55 52 41 57 30 55 C18 53 13 41 15 29 C17 19 25 13 36 13Z" fill="none" stroke="currentColor" stroke-width="2.7"/>
 <path d="M37 26 C46 26 50 32 49 39 C48 46 41 49 34 48 C26 47 23 40 24 33 C25 28 30 26 37 26Z" fill="none" stroke="currentColor" stroke-width="2.3" opacity=".5"/>
 <circle cx="21" cy="44" r="3.6" fill="currentColor"/>
 <circle cx="52" cy="35" r="3.4" fill="var(--panel)" stroke="#9aa4b2" stroke-width="2.2"/>
 <circle cx="40" cy="23" r="9" fill="none" stroke="#2560b8" stroke-width="1.9"/>
 <circle cx="40" cy="23" r="5.2" fill="#2560b8"/>
</g></defs></svg>

<div id="root">
  <div class="chip" id="chip">
    <svg width="21" height="21" style="color:var(--ink);flex:0 0 auto"><use href="#mk" transform="scale(0.29)"/></svg>
    <span class="nm" id="chip-focus">the map</span>
    <span class="filinglbl">filing…</span>
    <span class="infmark">off</span>
    <span class="dot"></span>
  </div>
  <div class="panel" id="panel">
    <div class="hd">
      <span class="draghandle" id="draghandle"><svg width="18" height="18" style="color:var(--muted);pointer-events:none"><use href="#mk" transform="scale(0.25)"/></svg><span class="brand">harness<span class="b">map</span></span></span>
      <span class="icobtn" id="x" title="close">✕</span>
    </div>
    <div class="focus" id="p-focus">the map</div>
    <div class="status"><span class="dot" style="width:7px;height:7px"></span><span id="p-state">map current</span> <span class="inmap" id="p-inmap"></span></div>
    <div class="last" id="p-last"></div>
    <div class="open-b" id="open-map">open map</div>
    <div class="inf" id="inf-toggle"><span>map influence</span><span class="sw"><span class="knob"></span></span></div>
    <div class="infnote">your sessions won't see the map · it keeps filing quietly</div>
    <div class="talk">
      <div class="mclog" id="mclog"></div>
      <div class="row"><input id="ask" placeholder="talk to the map…" autocomplete="off"><button class="snd" id="send">send</button></div>
    </div>
    <div class="ver" id="ver"></div>
  </div>
  <div class="offline"><svg width="18" height="18" style="color:var(--muted)"><use href="#mk" transform="scale(0.25)"/></svg> <span id="offmsg">map not running</span></div>
</div>

<script>
const COMPANION_VER = '0.9.111'; // bump on each companion ship — shown in the panel so a stale build is obvious
const B = document.body, $ = (id) => document.getElementById(id);
const core = window.__TAURI__ && window.__TAURI__.core;
const invoke = (cmd, args) => core ? core.invoke(cmd, args) : Promise.reject(new Error('no tauri'));
// Reach the map through the app's NATIVE layer (no browser Origin), so the companion
// always reaches the server regardless of its version. Falls back to a same-origin
// browser fetch when not running inside the app (e.g. the server-served /widget page).
async function apiFetch(path, opts = {}) {
  if (core) {
    const method = opts.method || 'GET';
    const body = opts.body != null ? String(opts.body) : null;
    try {
      const txt = await core.invoke('api', { method, path, body });
      return { ok: true, status: 200, json: async () => JSON.parse(txt), text: async () => txt };
    } catch (e) {
      return { ok: false, status: 0, json: async () => { throw e; }, text: async () => '' };
    }
  }
  return fetch(API + path, opts);
}
let S = null, filingTimer = null, PORT = 8790, API = 'http://127.0.0.1:8790', WSB = 'ws://127.0.0.1:8790';

const disp = (n) => n ? (n.title || n.content || '') : '';
function activeChat() { return (S.chats||[]).find(c => c.id === S.mainChatId) || (S.chats||[])[0]; }
function focusName() {
  const c = activeChat(); if (!c) return null;
  const f = (S.nodes||[]).find(n => n.id === c.focusContainerId);
  return f ? disp(f) : null;
}
function mapName() { return (S.projects||[]).find(p => p.id === S.projectId)?.name || 'the map'; }
function toSortCount() {
  if (!S) return 0;
  const ts = (S.nodes||[]).find(n => n.parentId == null && /^(to sort)\b/i.test((n.title||n.content||'')));
  return ts ? (S.nodes||[]).filter(n => n.parentId === ts.id).length : 0;
}

function render() {
  if (!S) return;
  B.classList.remove('offline');
  const fn = focusName(), mn = mapName(), ts = toSortCount();
  const label = fn || mn || 'the map';
  $('chip-focus').textContent = label; $('chip-focus').title = label;
  $('p-focus').textContent = label;
  $('p-inmap').textContent = fn ? `· in ${mn}` : '';
  const bits = [];
  if (S.updateAvailable) bits.push('update available');
  bits.push(S.influenceOff ? 'influence closed' : 'map current');
  if (ts) bits.push(`${ts} to sort`);
  $('p-state').textContent = bits.join(' · ');
  B.classList.toggle('infoff', !!S.influenceOff);
  B.classList.toggle('attn', !!(ts || S.updateAvailable) && !S.influenceOff);
  const f = (S.filings || {});
  $('p-last').textContent = f.lastFiled ? `just filed — ${String(f.lastFiled).slice(0,60)}` : (f.pending ? `${f.pending} exchange(s) waiting to file` : '');
  $('ver').textContent = `companion v${COMPANION_VER}` + (S.build ? ` · server ${String(S.build).slice(0,7)}` : '');
}

function offline(msg) { const m = $('offmsg'); if (m) m.textContent = msg; B.classList.add('offline'); }
async function loadState() {
  try {
    const r = await apiFetch('/api/state', { cache: 'no-store' });
    // 403 = the server is up but on an old build that blocks the app's origin.
    if (r.status === 403) { offline("map out of date — run “update map”"); return; }
    if (!r.ok) throw 0;
    S = await r.json(); render();
  } catch { offline('map not running'); }
}
function flashFiling() {
  B.classList.add('filing');
  clearTimeout(filingTimer);
  filingTimer = setTimeout(() => B.classList.remove('filing'), 4000);
}
function connect() {
  let ws;
  try { ws = new WebSocket(WSB + '/ws'); } catch { setTimeout(connect, 3000); return; }
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'map') { S = m; render(); }
    else if (m.type === 'turn' || m.type === 'chat_delta') flashFiling();
    else if (m.type === 'round') { flashFiling(); loadState(); }
  };
  ws.onclose = () => { setTimeout(connect, 3000); }; // reconnect; offline state is decided by the proxy poll, not the socket
  ws.onopen = () => loadState();
}

// dragging: mousedown on a handle → if the pointer moves, hand off to the OS drag;
// if it doesn't move, treat it as a click (so the pill can both move AND open).
function armDrag(el, onClick) {
  if (!el) return;
  el.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    const sx = e.screenX, sy = e.screenY; let moved = false;
    const mm = (m) => {
      if (!moved && (Math.abs(m.screenX - sx) > 4 || Math.abs(m.screenY - sy) > 4)) {
        moved = true; cleanup(); invoke('start_drag').catch(() => {});
      }
    };
    const mu = () => { cleanup(); if (!moved && onClick) onClick(); };
    const cleanup = () => { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); };
    document.addEventListener('mousemove', mm); document.addEventListener('mouseup', mu);
  });
}

// interactions
function openPanel(){ B.classList.add('open'); }
function closePanel(){ B.classList.remove('open'); }
armDrag($('chip'), openPanel);
armDrag($('draghandle'));
armDrag($('p-focus'));
$('x').onclick = (e) => { e.stopPropagation(); closePanel(); };
// minimize/restore — an ON-SCREEN collapse to a small corner badge (never moves the
// window off-screen, so it can't vanish). Restore replays the appear animation.
function announce() { B.classList.remove('appearing'); void document.body.offsetWidth; B.classList.add('appearing'); setTimeout(() => B.classList.remove('appearing'), 3600); }
$('open-map').onclick = () => { invoke('open_map').catch(() => { try { window.open(API + '/', '_blank'); } catch {} }); };
$('inf-toggle').onclick = async () => {
  B.classList.toggle('infoff'); // optimistic
  try { await apiFetch('/api/influence/toggle', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }); } catch {}
  loadState();
};
// talk to the map — a small scrollable log; answers scroll instead of breaking the
// panel, and proposals render with an approve button (simple ones apply here; a tidy
// or a multi-step plan opens the full map, which has the review UI).
const hist = [];
// Load the SHARED server-side guide history so the widget and the browser guide are one
// continuous conversation — same guide, same memory (Jacob).
async function loadHistory() {
  try {
    const r = await apiFetch('/api/map-chat/history'); if (!r.ok) return;
    const d = await r.json(); const h = d.history || [];
    // Shared as CONTEXT (the guide is one person across app + browser), but the compact
    // widget starts CLEAN — it must not dump the whole transcript into a 320×300 window.
    if (h.length) { hist.length = 0; hist.push(...h); }
  } catch {}
}
function mclog() { const l = $('mclog'); l.classList.add('show'); return l; }
function pushMsg(who, text) {
  const d = document.createElement('div'); d.className = 'm ' + (who === 'you' ? 'you' : 'map'); d.textContent = text;
  const l = mclog(); l.appendChild(d); l.scrollTop = l.scrollHeight; return d;
}
function stepDesc(s) {
  if (s.kind === 'focus') return `talk about “${s.nodeName}”`;
  if (s.kind === 'light') { const l = s.lit || [], d = s.dim || []; return [l.length ? `light ${l.map(x => `“${x.name}”`).join(', ')}` : '', d.length ? `dim ${d.map(x => `“${x.name}”`).join(', ')}` : ''].filter(Boolean).join('; '); }
  if (s.kind === 'zoom') return `view only “${s.nodeName}”`;
  if (s.kind === 'favorite') return `pin “${s.nodeName}”`;
  if (s.kind === 'unfavorite') return `unpin “${s.nodeName}”`;
  if (s.kind === 'tidy') return `tidy “${s.nodeName}”`;
  return s.kind || 'change';
}
async function applyStep(s) {
  const cid = S && S.mainChatId; if (!cid) throw new Error('no map');
  if (s.kind === 'focus') await apiFetch(`/api/chats/${cid}/focus`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nodeId: s.nodeId }) });
  else if (s.kind === 'light') { for (const x of (s.lit || [])) await apiFetch(`/api/chats/${cid}/lit`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nodeId: x.id, on: true }) }); for (const x of (s.dim || [])) await apiFetch(`/api/chats/${cid}/lit`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nodeId: x.id, on: false }) }); }
  else if (s.kind === 'zoom') await apiFetch(`/api/chats/${cid}/zoomin`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ nodeId: s.nodeId, focus: false }) });
  else if (s.kind === 'favorite' || s.kind === 'unfavorite') await apiFetch(`/api/nodes/${s.nodeId}/favorite`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ on: s.kind === 'favorite' }) });
}
const SIMPLE = new Set(['focus', 'light', 'zoom', 'favorite', 'unfavorite']);
function openInMap(ask) { invoke('open_map', { ask: ask || '' }).catch(() => { try { window.open(API + '/' + (ask ? '?ask=' + encodeURIComponent(ask) : ''), '_blank'); } catch {} }); }
// The map proposed a change. The widget stays small: don't show the proposal — offer
// "just do it" (apply now) or "open in map" (review it in the browser's talk-to-map,
// which reopens with this question so the proposal appears without retyping).
function renderProp(steps, question) {
  if (!Array.isArray(steps) || !steps.length) return;
  const card = document.createElement('div'); card.className = 'm-prop';
  card.textContent = `the map wants to make ${steps.length} change${steps.length > 1 ? 's' : ''}: ${steps.map(stepDesc).join('; ')}`;
  const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap';
  const doit = document.createElement('button'); doit.textContent = '⚡ just do it';
  const simple = steps.every(s => SIMPLE.has(s.kind));
  doit.onclick = async () => {
    if (!simple) { openInMap(question); return; } // tidy / multi-step: review in the map
    doit.disabled = true;
    try { for (const s of steps) await applyStep(s); card.textContent = '✓ done'; card.classList.add('done'); loadState(); }
    catch (e) { card.textContent = 'failed: ' + e.message; card.classList.add('done'); }
  };
  const review = document.createElement('button'); review.textContent = 'open in map';
  review.style.cssText = 'background:var(--panel);color:var(--accent);border:1px solid var(--hair)';
  review.onclick = () => openInMap(question);
  row.appendChild(doit); row.appendChild(review); card.appendChild(row);
  const l = mclog(); l.appendChild(card); l.scrollTop = l.scrollHeight;
}
async function ask() {
  const q = $('ask').value.trim(); if (!q) return;
  $('ask').value = ''; pushMsg('you', q);
  const w = pushMsg('map', '…');
  try {
    const r = await apiFetch('/api/map-chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ question: q, history: hist.slice(-4), client: 'companion' }) });
    if (r.status === 403) { w.textContent = 'your map server is out of date — run “update map” in your CLI, then try again'; return; }
    const j = await r.json();
    w.textContent = j.answer || '(no answer)';
    hist.push({ q, a: j.answer });
    if (j.actions) renderProp(j.actions, q);
    const l = $('mclog'); l.scrollTop = l.scrollHeight;
  } catch { w.textContent = 'could not reach the map'; }
}
$('send').onclick = ask;
$('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePanel(); });

(async () => {
  try { PORT = await invoke('map_port_cmd'); } catch { PORT = 8790; }
  API = `http://127.0.0.1:${PORT}`; WSB = `ws://127.0.0.1:${PORT}`;
  announce(); // play the appear animation on launch so it's easy to spot
  await loadState();
  loadHistory(); // shared guide history (one conversation across app + browser)
  connect();
  setInterval(loadState, 5000); // proxy poll — keeps the companion live even when the WS can't connect (old server)
})();
</script>
